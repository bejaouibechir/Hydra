name: Feature request
description: Suggest a connector, a transformation step or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Hydra to do?
      description: If relevant, show the YAML you would like to write.
      render: yaml
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
