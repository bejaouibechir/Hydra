# Publie hydra-etl sur PyPI.
#
# Distinct de native-wheels.yml, qui publie hydra-native sous son propre tag.
# Ici, un tag `vX.Y.Z` déclenche toute la chaîne : Studio, vérifications,
# construction, publication.
#
# Aucun jeton n'est stocké : la publication passe par le Trusted Publishing de
# PyPI, comme pour hydra-native. Il faut donc déclarer une fois, sur
# pypi.org/manage/project/hydra-etl/settings/publishing/, ce dépôt, ce fichier
# de workflow et l'environnement `pypi`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      # Le tag fait foi, mais il doit correspondre au code. Sans ce garde-fou,
      # on publie un jour une 0.10.0 qui se déclare 0.9.6, et personne ne
      # comprend pourquoi.
      - name: Le tag correspond-il à __version__ ?
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('hydra_etl/__init__.py').read_text()).group(1))")
          echo "tag=$TAG  code=$CODE"
          test "$TAG" = "$CODE" || {
            echo "::error::Le tag $TAG ne correspond pas à __version__ = $CODE"
            exit 1
          }

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[mcp]"
          pip install pytest jsonschema

      # La spécification est générée depuis le code et embarquée dans le
      # paquet. Si elle a dérivé, la documentation et le serveur MCP
      # mentiraient sur ce que le moteur accepte réellement.
      - name: La spécification du DSL est-elle à jour ?
        run: python tools/spec_export.py --check

      - name: Tests du serveur MCP
        run: python -m pytest tests/test_mcp_server.py -q

      - name: Studio
        run: python scripts/build_studio.py --ci

      - name: Construction
        run: python -m build

      # Le Studio et la spécification sont générés, pas versionnés : s'ils
      # manquaient du wheel, l'installation serait cassée sans que rien ne
      # l'annonce. C'est déjà arrivé une fois.
      - name: Le wheel contient-il tout ?
        run: |
          WHEEL=$(ls dist/*.whl)
          echo "$WHEEL"
          python - "$WHEEL" <<'PY'
          import sys, zipfile
          noms = zipfile.ZipFile(sys.argv[1]).namelist()
          for prefixe, quoi in (("hydra_etl/ai/schemas/", "la spécification du DSL"),
                                ("hydra_etl/studio_dist/", "le Studio")):
              n = sum(1 for x in noms if x.startswith(prefixe))
              print(f"{quoi} : {n} fichiers")
              if not n:
                  sys.exit(f"{quoi} est absente du wheel")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi          # y déclarer le trusted publisher de hydra-etl
    permissions:
      id-token: write          # Trusted Publishing : aucun jeton dans le dépôt
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Deux voies, dans cet ordre :
      #  - si le secret PYPI_API_TOKEN existe, il est utilisé ;
      #  - sinon, l'action retombe sur le Trusted Publishing (OIDC), qui exige
      #    d'avoir déclaré ce dépôt, ce fichier et l'environnement `pypi` sur
      #    pypi.org/manage/project/hydra-etl/settings/publishing/
      # Le jeton dépanne quand l'accès au compte PyPI est perdu ; l'éditeur de
      # confiance reste préférable à terme, car il n'expire pas et ne se vole pas.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Publie l'image de conteneur sur GHCR, au meme tag que le paquet PyPI.
  #
  # Jusqu'ici l'image etait poussee a la main : elle est restee bloquee en
  # 0.9.6 pendant que le paquet passait en 0.11.3, et `latest` pointait sur
  # cette meme 0.9.6. Un utilisateur Docker installait donc une version sans
  # le correctif ${SECRET:}. Ce job supprime l'etape manuelle.
  #
  # Aucun jeton a stocker : GITHUB_TOKEN suffit pour publier dans le GHCR du
  # depot, grace a la permission `packages: write` ci-dessous.
  container:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version depuis le tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # arm64 est construit en emulation. Sans lui, un Mac Apple Silicon tire
      # une image amd64 et la fait tourner sous Rosetta : lent, bruyant en
      # avertissements, et parfois en echec franc.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Un premier build amd64 charge localement, seulement pour le verifier.
      # Le build de publication repart du meme cache : il ne recompile rien.
      - name: Construction de controle (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: GHCR/Dockerfile
          platforms: linux/amd64
          load: true
          tags: hydra:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Meme garde-fou que pour le tag plus haut, applique a l'image : elle
      # doit se declarer a la version qu'on s'apprete a publier. On lit
      # __version__ plutot que la sortie de `hdrctl --version`, dont la
      # banniere pourrait contenir d'autres nombres.
      - name: L'image annonce-t-elle la bonne version ?
        run: |
          VUE=$(docker run --rm hydra:check python -c "import hydra_etl; print(hydra_etl.__version__)")
          echo "image=$VUE  tag=${{ steps.v.outputs.version }}"
          test "$VUE" = "${{ steps.v.outputs.version }}" || {
            echo "::error::L'image annonce $VUE, le tag dit ${{ steps.v.outputs.version }}"
            exit 1
          }

      # `latest` ne suit que les tags v*, donc jamais une preversion.
      - name: Publication multi-architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          file: GHCR/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hydra:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/hydra:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
