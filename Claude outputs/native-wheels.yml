# Builds and publishes the optional native accelerators (rust/hydra_native).
#
# Separate from the Hydra wheel: hydra-native has its own version and its own
# tag (`native-vX.Y.Z`), like the VS Code extension. Hydra itself never depends
# on it — `pip install "hydra-etl[native]"` pulls it in for those who want it.
name: native-wheels

on:
  push:
    tags: ["native-v*"]
  pull_request:
    paths:
      - "rust/**"
      - "hydra_etl/**"
      - ".github/workflows/native-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.95.0"
  CRATE_DIR: rust/hydra_native
  # Tests that must stay green in both backends. The rest of the suite still
  # has pre-existing failures (cast aliases, transform parser, json url...);
  # they are tracked separately and will be added here once fixed.
  TEST_SET: >-
    tests/test_backend_switch.py
    tests/test_csv_rust_backend.py
    tests/test_frame_io_parity.py
    tests/test_csv_connector.py
    tests/test_executor.py
    tests/test_workflow.py
    tests/test_source_parser.py

jobs:
  test:
    name: tests (linux, python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rust unit tests
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo test --locked
      - name: Build and install the extension
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install pandas pyarrow pytest pyyaml pydantic click python-dotenv
          maturin build --release --locked --out dist --manifest-path ${{ env.CRATE_DIR }}/Cargo.toml
          python -m pip install --no-index --find-links dist hydra_native
      - name: Parity of the CSV reader with Python's csv module
        run: python -m pytest -q ${{ env.CRATE_DIR }}/tests
      - name: Test set, Python backend
        run: python -m pytest -q ${{ env.TEST_SET }}
      - name: Test set, Rust backend
        env:
          HYDRA_BACKEND: rust
        run: python -m pytest -q ${{ env.TEST_SET }}

  linux-wheels:
    name: wheels linux (cp3.9-cp3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # In the manylinux container maturin finds every CPython available and
      # builds one wheel per version (no abi3: pyo3-arrow needs the full C API).
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist --find-interpreter --manifest-path ${{ env.CRATE_DIR }}/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/*.whl

  other-wheels:
    name: wheel ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
        # macOS runners are arm64: setup-python starts at 3.10 there.
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      # maturin builds for the interpreter installed above.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist --manifest-path ${{ env.CRATE_DIR }}/Cargo.toml
      - name: Smoke test the wheel
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist hydra_native
          python -c "import hydra_native; print(hydra_native.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path ${{ env.CRATE_DIR }}/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [test, linux-wheels, other-wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/native-v')
    runs-on: ubuntu-latest
    environment: pypi          # configure the trusted publisher for hydra-native there
    permissions:
      id-token: write          # PyPI trusted publishing, no token stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
