<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Declarative, visual and zero deployment</title>
  <desc id="desc">Three capabilities available together, unlike alternatives that require deployment, a JVM or heavy infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf8fc"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f5270" flood-opacity=".13"/>
    </filter>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity=".24"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0e7490" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#22b8cf"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="32" fill="url(#grid)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="800" y="82" text-anchor="middle" fill="#0f2940" font-size="50" font-weight="800" letter-spacing=".5">DECLARATIVE + VISUAL + ZERO DEPLOYMENT</text>
    <text x="800" y="122" text-anchor="middle" fill="#557286" font-size="20">None is unique alone. Their combination is.</text>

    <!-- Three capability cards -->
    <g filter="url(#shadow)">
      <g transform="translate(95 188)">
        <rect width="390" height="245" rx="28" fill="#ffffff" stroke="#91c8d9" stroke-width="3"/>
        <circle cx="195" cy="73" r="42" fill="#e8fafd" stroke="#22b8cf" stroke-width="3"/>
        <path d="M183 56l-17 17 17 17M207 56l17 17-17 17M202 48l-14 50" fill="none" stroke="#0891b2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="195" y="148" text-anchor="middle" fill="#14364d" font-size="28" font-weight="800">DECLARATIVE</text>
        <text x="195" y="182" text-anchor="middle" fill="#58758a" font-size="17">a readable, version-controlled file</text>
        <g transform="translate(118 202)">
          <rect width="154" height="27" rx="13" fill="#eef9fc"/>
          <text x="77" y="19" text-anchor="middle" fill="#16829c" font-size="13" font-weight="700">YAML · Git · reproducible</text>
        </g>
      </g>

      <g transform="translate(605 188)">
        <rect width="390" height="245" rx="28" fill="#ffffff" stroke="#91c8d9" stroke-width="3"/>
        <circle cx="195" cy="73" r="42" fill="#e8fafd" stroke="#22b8cf" stroke-width="3"/>
        <path d="M169 61h42v28h-42zM211 75h18M159 75h10" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="151" cy="75" r="8" fill="#34d399"/><circle cx="237" cy="75" r="8" fill="#34d399"/>
        <text x="195" y="148" text-anchor="middle" fill="#14364d" font-size="28" font-weight="800">VISUAL</text>
        <text x="195" y="182" text-anchor="middle" fill="#58758a" font-size="17">understand the pipeline at a glance</text>
        <g transform="translate(123 202)">
          <rect width="144" height="27" rx="13" fill="#eef9fc"/>
          <text x="72" y="19" text-anchor="middle" fill="#16829c" font-size="13" font-weight="700">graph · flow · inspection</text>
        </g>
      </g>

      <g transform="translate(1115 188)">
        <rect width="390" height="245" rx="28" fill="#ffffff" stroke="#91c8d9" stroke-width="3"/>
        <circle cx="195" cy="73" r="42" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
        <path d="M171 85h49c13 0 20-8 20-18 0-11-9-19-20-19-5-14-17-22-31-18-10 3-16 11-17 20-11 1-18 8-18 18 0 9 7 17 17 17z" fill="none" stroke="#059669" stroke-width="4" stroke-linejoin="round"/>
        <path d="M181 68l10 10 20-22" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="195" y="148" text-anchor="middle" fill="#14364d" font-size="28" font-weight="800">NOTHING TO DEPLOY</text>
        <text x="195" y="182" text-anchor="middle" fill="#58758a" font-size="17">open, define, run</text>
        <g transform="translate(119 202)">
          <rect width="152" height="27" rx="13" fill="#ecfdf5"/>
          <text x="76" y="19" text-anchor="middle" fill="#087a5e" font-size="13" font-weight="700">no server · no JVM</text>
        </g>
      </g>
    </g>

    <!-- Convergence -->
    <g fill="none" stroke="#22b8cf" stroke-width="5" stroke-linecap="round">
      <path d="M290 450v46c0 32 28 48 62 48h368" marker-end="url(#arrow)"/>
      <path d="M800 450v78" marker-end="url(#arrow)"/>
      <path d="M1310 450v46c0 32-28 48-62 48H880" marker-end="url(#arrow)"/>
    </g>

    <!-- Unique combination -->
    <g transform="translate(565 515)" filter="url(#greenGlow)">
      <rect width="470" height="112" rx="56" fill="url(#green)"/>
      <circle cx="67" cy="56" r="34" fill="#effff9"/>
      <path d="M51 57l11 11 23-28" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="266" y="47" text-anchor="middle" fill="#043b31" font-size="24" font-weight="900" letter-spacing="1">THE COMPLETE TRIO</text>
      <text x="266" y="78" text-anchor="middle" fill="#075e4d" font-size="17" font-weight="700">all three, in one place</text>
    </g>

    <!-- Alternatives -->
    <text x="800" y="689" text-anchor="middle" fill="#506f83" font-size="16" font-weight="800" letter-spacing="2">ELSEWHERE, ONE PIECE IS ALWAYS MISSING</text>
    <g transform="translate(95 721)">
      <g>
        <rect width="255" height="105" rx="18" fill="#ffffff" stroke="#efb2bb" stroke-width="2"/>
        <circle cx="31" cy="30" r="10" fill="#fb7185"/><path d="M26 30h10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text x="52" y="36" fill="#17364d" font-size="19" font-weight="800">Airbyte</text>
        <text x="31" y="73" fill="#9a4958" font-size="15">deployment required</text>
      </g>
      <g transform="translate(287)">
        <rect width="255" height="105" rx="18" fill="#ffffff" stroke="#d4c2c6" stroke-width="2"/>
        <circle cx="31" cy="30" r="10" fill="#a8a0a2"/><path d="M26 30h10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text x="52" y="36" fill="#17364d" font-size="19" font-weight="800">Talend Open Studio</text>
        <text x="31" y="73" fill="#75666a" font-size="15">discontinued</text>
      </g>
      <g transform="translate(574)">
        <rect width="350" height="105" rx="18" fill="#ffffff" stroke="#efcf9a" stroke-width="2"/>
        <circle cx="31" cy="30" r="10" fill="#f59e0b"/><path d="M26 30h10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text x="52" y="36" fill="#17364d" font-size="19" font-weight="800">Apache Hop · Pentaho</text>
        <text x="31" y="73" fill="#8b641c" font-size="15">JVM required</text>
      </g>
      <g transform="translate(956)">
        <rect width="350" height="105" rx="18" fill="#ffffff" stroke="#efcf9a" stroke-width="2"/>
        <circle cx="31" cy="30" r="10" fill="#f59e0b"/><path d="M26 30h10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text x="52" y="36" fill="#17364d" font-size="19" font-weight="800">Apache NiFi</text>
        <text x="31" y="73" fill="#8b641c" font-size="15">heavy infrastructure</text>
      </g>
    </g>

    <text x="800" y="866" text-anchor="middle" fill="#557286" font-size="16">The difference is not a feature. It is the combination.</text>
  </g>
</svg>
