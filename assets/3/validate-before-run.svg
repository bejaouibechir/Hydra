<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Validation before execution</title>
  <desc id="desc">A pipeline is simulated and validated before it can reach real data, which remains untouched.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf8fc"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0e7490" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#4fdff4"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="32" fill="url(#grid)"/>
  <circle cx="790" cy="470" r="350" fill="#13c8dd" opacity=".07"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="800" y="92" text-anchor="middle" fill="#0f2940" font-size="56" font-weight="800" letter-spacing="1">VALIDATION BEFORE EXECUTION</text>

    <!-- Sources -->
    <g transform="translate(90 235)">
      <text x="150" y="-28" text-anchor="middle" fill="#557286" font-size="16" font-weight="700" letter-spacing="2">PIPELINE</text>
      <g fill="#ffffff" stroke="#9fc9d8" stroke-width="2">
        <rect width="300" height="90" rx="16"/>
        <rect y="112" width="300" height="90" rx="16"/>
        <rect y="224" width="300" height="90" rx="16"/>
      </g>
      <g fill="none" stroke="#54d9ed" stroke-width="3">
        <path d="M30 28h24l12 12v26H30z"/><path d="M54 28v13h12"/>
        <path d="M30 140h24l12 12v26H30z"/><path d="M54 140v13h12"/>
        <path d="M30 252h24l12 12v26H30z"/><path d="M54 252v13h12"/>
      </g>
      <g fill="#17364d" font-size="22" font-weight="700">
        <text x="88" y="55">Files</text>
        <text x="88" y="167">Transformations</text>
        <text x="88" y="279">Destination</text>
      </g>
      <g fill="#648296" font-size="14">
        <text x="88" y="76">CSV · JSON · SQL</text>
        <text x="88" y="188">rules and references</text>
        <text x="88" y="300">table or database</text>
      </g>
    </g>

    <!-- Reference checker -->
    <g transform="translate(90 624)">
      <rect width="300" height="104" rx="18" fill="#fff7f8" stroke="#f4a6b2" stroke-width="2"/>
      <circle cx="51" cy="52" r="25" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-width="2"/>
      <path d="M51 37v20m0 10v1" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
      <text x="91" y="42" fill="#8f263a" font-size="17" font-weight="700">Compilation</text>
      <text x="91" y="67" fill="#a45a68" font-size="14">catches a broken reference</text>
    </g>

    <!-- Main command into validation chamber -->
    <path d="M390 430H555" fill="none" stroke="#4fdff4" stroke-width="5" marker-end="url(#arrow)" filter="url(#glow)"/>
    <g transform="translate(405 368)">
      <rect width="150" height="68" rx="14" fill="#ffffff" stroke="#22b8cf" stroke-width="2"/>
      <text x="21" y="29" fill="#0891b2" font-family="Consolas,monospace" font-size="20">&gt;_</text>
      <text x="75" y="51" text-anchor="middle" fill="#16445b" font-size="14" font-weight="800" letter-spacing="1">1 COMMAND</text>
    </g>

    <!-- Validation chamber -->
    <g transform="translate(575 205)">
      <rect width="480" height="505" rx="42" fill="#ffffff" stroke="#22b8cf" stroke-width="4"/>
      <rect x="16" y="16" width="448" height="473" rx="31" fill="#eafafd" fill-opacity=".82" stroke="#9ed8e3" stroke-width="2"/>
      <path d="M70 122H178v65h105v65h120M178 187v112h-78m183-47v104h116" fill="none" stroke="#43e3b1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#ffffff" stroke="#10b981" stroke-width="3">
        <rect x="42" y="91" width="70" height="62" rx="12"/>
        <rect x="143" y="156" width="70" height="62" rx="12"/>
        <rect x="248" y="221" width="70" height="62" rx="12"/>
        <rect x="364" y="190" width="70" height="62" rx="12"/>
        <rect x="65" y="268" width="70" height="62" rx="12"/>
        <rect x="364" y="325" width="70" height="62" rx="12"/>
      </g>
      <g fill="#34d399">
        <circle cx="77" cy="122" r="13"/><circle cx="178" cy="187" r="13"/><circle cx="283" cy="252" r="13"/>
        <circle cx="399" cy="221" r="13"/><circle cx="100" cy="299" r="13"/><circle cx="399" cy="356" r="13"/>
      </g>
      <g fill="none" stroke="#052b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M70 122l5 5 10-12"/><path d="M171 187l5 5 10-12"/><path d="M276 252l5 5 10-12"/>
        <path d="M392 221l5 5 10-12"/><path d="M93 299l5 5 10-12"/><path d="M392 356l5 5 10-12"/>
      </g>
      <rect x="54" y="408" width="372" height="67" rx="18" fill="url(#green)" filter="url(#glow)"/>
      <circle cx="93" cy="441" r="20" fill="#edfff9"/>
      <path d="M83 441l7 7 15-17" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="128" y="436" fill="#052c27" font-size="20" font-weight="900">EXECUTION POSSIBLE</text>
      <text x="128" y="459" fill="#075e4d" font-size="14" font-weight="700">deterministic proof · zero mutation</text>
      <text x="240" y="-27" text-anchor="middle" fill="#16445b" font-size="20" font-weight="800" letter-spacing="2">FULL SIMULATION</text>
    </g>

    <!-- La validation autorise le passage sans toucher les données -->
    <g fill="#0891b2" stroke="#0891b2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1067 457h82" fill="none" stroke-width="8"/>
      <path d="M1137 439l24 18-24 18z" stroke-width="3"/>
    </g>

    <!-- Untouched data vault -->
    <g transform="translate(1185 235)">
      <rect width="325" height="445" rx="34" fill="#ffffff" fill-opacity=".92" stroke="#8bb9ca" stroke-width="3"/>
      <path d="M18 73h289" stroke="#b6d2dd" stroke-width="2"/>
      <circle cx="44" cy="37" r="7" fill="#34d399"/>
      <text x="164" y="45" text-anchor="middle" fill="#16445b" font-size="18" font-weight="800" letter-spacing="1">UNTOUCHED DATA</text>
      <g transform="translate(57 128)" fill="#e7f7fb" stroke="url(#cyan)" stroke-width="3">
        <ellipse cx="105" cy="25" rx="105" ry="25"/>
        <path d="M0 25v65c0 14 47 25 105 25s105-11 105-25V25"/>
        <ellipse cx="105" cy="90" rx="105" ry="25"/>
        <path d="M0 90v65c0 14 47 25 105 25s105-11 105-25V90"/>
        <ellipse cx="105" cy="155" rx="105" ry="25"/>
      </g>
    </g>

    <text x="800" y="860" text-anchor="middle" fill="#557286" font-size="16">The pipeline is tested. Real data never is.</text>
  </g>
</svg>
