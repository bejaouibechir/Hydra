<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Built to integrate, install only what you need</title>
  <desc id="desc">Hydra exposes a FastAPI REST API with interactive documentation at /docs. Install the core engine alone or add only the server, PostgreSQL support, or every available option.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf8fc"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0f5270" flood-opacity=".13"/>
    </filter>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#10b981" flood-opacity=".22"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0e7490" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#22b8cf"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="32" fill="url(#grid)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="800" y="78" text-anchor="middle" fill="#0f2940" font-size="50" font-weight="800" letter-spacing=".5">BUILT TO INTEGRATE. INSTALL ONLY WHAT YOU NEED.</text>
    <text x="800" y="120" text-anchor="middle" fill="#557286" font-size="20">A REST API for every tool. Optional packages for every use case.</text>

    <!-- Left: REST integration -->
    <g transform="translate(70 169)">
      <text x="350" y="30" text-anchor="middle" fill="#506f83" font-size="17" font-weight="800" letter-spacing="2">INTEGRATE FROM ANYWHERE</text>

      <g transform="translate(148 64)" filter="url(#shadow)">
        <rect width="404" height="350" rx="32" fill="#ffffff" stroke="#22b8cf" stroke-width="4"/>
        <path d="M0 62h404" stroke="#b7dce6" stroke-width="2"/>
        <circle cx="32" cy="31" r="8" fill="#fb7185"/><circle cx="58" cy="31" r="8" fill="#fbbf24"/><circle cx="84" cy="31" r="8" fill="#34d399"/>
        <text x="202" y="39" text-anchor="middle" fill="#17364d" font-size="17" font-weight="800">Hydra REST API</text>
        <g transform="translate(29 88)">
          <rect width="346" height="57" rx="15" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
          <rect x="15" y="14" width="54" height="29" rx="8" fill="#34d399"/>
          <text x="42" y="34" text-anchor="middle" fill="#053c31" font-size="13" font-weight="900">POST</text>
          <text x="86" y="34" fill="#17364d" font-family="Consolas,monospace" font-size="16">/api/jobs/run</text>
        </g>
        <g transform="translate(29 160)">
          <rect width="346" height="57" rx="15" fill="#eef9fc" stroke="#89c9dc" stroke-width="2"/>
          <rect x="15" y="14" width="54" height="29" rx="8" fill="#22b8cf"/>
          <text x="42" y="34" text-anchor="middle" fill="#073b4c" font-size="13" font-weight="900">GET</text>
          <text x="86" y="34" fill="#17364d" font-family="Consolas,monospace" font-size="16">/api/jobs/status</text>
        </g>
        <g transform="translate(29 232)" filter="url(#greenGlow)">
          <rect width="346" height="82" rx="18" fill="url(#green)"/>
          <circle cx="44" cy="41" r="24" fill="#effff9"/>
          <path d="M34 41h20M44 31v20" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
          <text x="82" y="34" fill="#043b31" font-size="20" font-weight="900">/docs</text>
          <text x="82" y="57" fill="#075e4d" font-size="14" font-weight="700">interactive FastAPI documentation</text>
        </g>
      </g>

      <!-- Integrations around the API -->
      <g filter="url(#shadow)">
        <g transform="translate(0 105)">
          <rect width="124" height="90" rx="20" fill="#ffffff" stroke="#9fc9d8" stroke-width="2.5"/>
          <path d="M30 29h64v33H30zM39 70h46" fill="none" stroke="#0891b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="62" y="84" text-anchor="middle" fill="#17364d" font-size="14" font-weight="800">CI/CD</text>
        </g>
        <g transform="translate(0 257)">
          <rect width="124" height="90" rx="20" fill="#ffffff" stroke="#9fc9d8" stroke-width="2.5"/>
          <rect x="37" y="18" width="50" height="48" rx="8" fill="none" stroke="#0891b2" stroke-width="3"/>
          <path d="M49 28h26M49 38h20M49 48h25" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>
          <text x="62" y="84" text-anchor="middle" fill="#17364d" font-size="14" font-weight="800">YOUR APP</text>
        </g>
        <g transform="translate(576 181)">
          <rect width="124" height="90" rx="20" fill="#ffffff" stroke="#9fc9d8" stroke-width="2.5"/>
          <circle cx="62" cy="40" r="24" fill="none" stroke="#0891b2" stroke-width="3"/>
          <path d="M38 40h48M62 16c9 9 13 17 13 24S71 55 62 64M62 16c-9 9-13 17-13 24s4 15 13 24" fill="none" stroke="#0891b2" stroke-width="2.5"/>
          <text x="62" y="84" text-anchor="middle" fill="#17364d" font-size="14" font-weight="800">ANY TOOL</text>
        </g>
      </g>
      <path d="M124 150h24" fill="none" stroke="#22b8cf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M124 302h24" fill="none" stroke="#22b8cf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M576 226h-24" fill="none" stroke="#22b8cf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

      <g transform="translate(113 449)">
        <rect width="474" height="59" rx="29" fill="#eafafd"/>
        <text x="237" y="27" text-anchor="middle" fill="#16445b" font-size="18" font-weight="900">NOT JUST USED — INTEGRATED</text>
        <text x="237" y="47" text-anchor="middle" fill="#557286" font-size="13">one stable HTTP interface</text>
      </g>
    </g>

    <!-- Divider -->
    <path d="M800 177v510" stroke="#b8d4df" stroke-width="2" stroke-dasharray="8 12"/>

    <!-- Right: Modular installation -->
    <g transform="translate(855 169)">
      <text x="337" y="30" text-anchor="middle" fill="#506f83" font-size="17" font-weight="800" letter-spacing="2">MODULAR INSTALLATION</text>
      <g transform="translate(0 66)" filter="url(#shadow)">
        <g>
          <rect width="675" height="100" rx="22" fill="#ffffff" stroke="#89c9dc" stroke-width="2.5"/>
          <circle cx="46" cy="50" r="24" fill="#e8fafd" stroke="#22b8cf" stroke-width="2"/>
          <text x="46" y="58" text-anchor="middle" fill="#0891b2" font-size="23" font-weight="900">1</text>
          <text x="84" y="38" fill="#17364d" font-size="20" font-weight="900">Core engine + CLI</text>
          <text x="84" y="68" fill="#557286" font-family="Consolas,monospace" font-size="17">pip install hydra-etl</text>
          <rect x="535" y="32" width="107" height="36" rx="18" fill="#eef9fc"/>
          <text x="588" y="55" text-anchor="middle" fill="#16829c" font-size="13" font-weight="800">MINIMAL</text>
        </g>

        <g transform="translate(0 120)">
          <rect width="675" height="100" rx="22" fill="#ffffff" stroke="#89c9dc" stroke-width="2.5"/>
          <circle cx="46" cy="50" r="24" fill="#e8fafd" stroke="#22b8cf" stroke-width="2"/>
          <text x="46" y="58" text-anchor="middle" fill="#0891b2" font-size="23" font-weight="900">+</text>
          <text x="84" y="38" fill="#17364d" font-size="20" font-weight="900">REST server + Studio</text>
          <text x="84" y="68" fill="#557286" font-family="Consolas,monospace" font-size="17">pip install &quot;hydra-etl[server]&quot;</text>
          <rect x="535" y="32" width="107" height="36" rx="18" fill="#eef9fc"/>
          <text x="588" y="55" text-anchor="middle" fill="#16829c" font-size="13" font-weight="800">SERVER</text>
        </g>

        <g transform="translate(0 240)">
          <rect width="675" height="100" rx="22" fill="#ffffff" stroke="#89c9dc" stroke-width="2.5"/>
          <circle cx="46" cy="50" r="24" fill="#e8fafd" stroke="#22b8cf" stroke-width="2"/>
          <text x="46" y="58" text-anchor="middle" fill="#0891b2" font-size="23" font-weight="900">+</text>
          <text x="84" y="38" fill="#17364d" font-size="20" font-weight="900">PostgreSQL connector</text>
          <text x="84" y="68" fill="#557286" font-family="Consolas,monospace" font-size="17">pip install &quot;hydra-etl[postgres]&quot;</text>
          <rect x="535" y="32" width="107" height="36" rx="18" fill="#eef9fc"/>
          <text x="588" y="55" text-anchor="middle" fill="#16829c" font-size="13" font-weight="800">POSTGRES</text>
        </g>

        <g transform="translate(0 360)" filter="url(#greenGlow)">
          <rect width="675" height="100" rx="22" fill="#effcf7" stroke="#34d399" stroke-width="3"/>
          <circle cx="46" cy="50" r="24" fill="#d9faef" stroke="#34d399" stroke-width="2"/>
          <path d="M35 50l8 8 17-21" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="84" y="38" fill="#075e4d" font-size="20" font-weight="900">Everything</text>
          <text x="84" y="68" fill="#397666" font-family="Consolas,monospace" font-size="17">pip install &quot;hydra-etl[all]&quot;</text>
          <rect x="535" y="32" width="107" height="36" rx="18" fill="url(#green)"/>
          <text x="588" y="55" text-anchor="middle" fill="#043b31" font-size="13" font-weight="900">COMPLETE</text>
        </g>
      </g>

      <g transform="translate(90 559)">
        <rect width="495" height="59" rx="29" fill="#ecfdf5"/>
        <text x="247" y="27" text-anchor="middle" fill="#075e4d" font-size="18" font-weight="900">INSTALL CAPABILITIES — NOT BAGGAGE</text>
        <text x="247" y="47" text-anchor="middle" fill="#397666" font-size="13">start small · extend when needed</text>
      </g>
    </g>

    <text x="800" y="848" text-anchor="middle" fill="#17364d" font-size="19" font-weight="800">Expose what others need. Install only what you use.</text>
    <text x="800" y="876" text-anchor="middle" fill="#557286" font-size="15">Hydra fits into your stack instead of forcing a new one.</text>
  </g>
</svg>
