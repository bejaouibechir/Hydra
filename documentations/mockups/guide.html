<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Executable reference for Hydra DSL sources, destinations, transformations, workflows, triggers and policies.">
<title>Guide — Hydra Guide (mock)</title>
<style>
:root{--bg:#fff;--bg-soft:#f6f8f8;--bg-panel:#fff;--bg-code:#f4f6f6;
--text:#0e1a17;--text-soft:#5a6a66;--text-mut:#8a9793;--border:#e2e8e6;--border-strong:#cdd8d5;
--accent:#0f766e;--accent-soft:#d7efeb;--accent-text:#0b5850;--ok:#15803d;--ok-soft:#dcf3e3;
--warn:#b45309;--warn-soft:#fbedd8;--err:#b91c1c;--err-soft:#fbe4e4;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
html[data-theme="dark"]{--bg:#0d1412;--bg-soft:#111b18;--bg-panel:#131f1b;--bg-code:#0b1310;
--text:#e7efec;--text-soft:#9db0aa;--text-mut:#6f827c;--border:#20302b;--border-strong:#2c413a;
--accent:#2dd4bf;--accent-soft:#123a34;--accent-text:#7bead9;--ok:#4ade80;--ok-soft:#12331f;
--warn:#fbbf24;--warn-soft:#3a2c0e;--err:#f87171;--err-soft:#3a1616;}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
a{color:var(--accent);text-decoration:none}
:where(a,button,input):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;height:56px;padding:0 clamp(12px,3vw,22px);background:var(--bg);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;flex-shrink:0}
.logo{width:22px;height:22px;color:var(--accent)}
.nav{display:flex;gap:4px}
.nav a{padding:6px 12px;border-radius:7px;color:var(--text-soft);font-size:14px;font-weight:500;white-space:nowrap}
.nav a.active{color:var(--accent-text);background:var(--accent-soft)}
.nav a:hover{color:var(--text)}
.spacer{flex:1}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;flex-shrink:0;border:1px solid var(--border);background:var(--bg-soft);color:var(--text-soft);cursor:pointer}
.iconbtn:hover{color:var(--text);border-color:var(--border-strong)}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(12px,3vw,22px) 80px}
/* hero */
.hero{text-align:center;padding:44px 0 30px}
.hero h1{font-size:clamp(26px,4vw,34px);margin:0 0 8px;font-weight:600;letter-spacing:-.01em}
.hero p{font-size:clamp(15px,2.2vw,17px);color:var(--text-soft);margin:0 auto 22px;max-width:60ch}
.bigsearch{position:relative;max-width:640px;margin:0 auto}
.bigsearch input{width:100%;padding:14px 16px 14px 46px;font-size:15px;font-family:var(--sans);
  border:1px solid var(--border-strong);border-radius:12px;background:var(--bg-panel);color:var(--text);outline:none}
.bigsearch input:focus{border-color:var(--accent)}
.bigsearch .si{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-mut)}
.bigsearch .kk{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-mut);border:1px solid var(--border-strong);border-radius:5px;padding:2px 7px}
.intentchips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.ichip{font-size:12.5px;padding:6px 13px;border:1px solid var(--border);border-radius:20px;background:var(--bg-panel);color:var(--text-soft);cursor:pointer}
.ichip:hover{border-color:var(--accent);color:var(--accent-text)}
.ichip .a{color:var(--accent);font-weight:600}
/* catalog toolbar */
.catbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.modes{display:inline-flex;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden}
.modes button{padding:7px 14px;font-size:13px;font-weight:500;background:var(--bg-panel);color:var(--text-soft);border:none;cursor:pointer;border-right:1px solid var(--border)}
.modes button:last-child{border-right:none}
.modes button.on{background:var(--accent-soft);color:var(--accent-text)}
.filtergroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filteropts{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.flabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-mut);font-weight:600}
.fchip{font-size:12px;padding:4px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg-panel);color:var(--text-soft);cursor:pointer}
.fchip:hover{border-color:var(--accent)}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .fchip.on{color:#04211d}
.count{margin-left:auto;font-size:12.5px;color:var(--text-mut)}
/* catalog */
.grouphead{width:100%;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mut);font-weight:600;margin:22px 0 10px;padding:0;border:0;background:transparent;display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer}
.grouphead:hover{color:var(--text)}
.grouphead .dot{width:9px;height:9px;border-radius:2px}
.groupchev{margin-left:auto;font-size:15px;transition:transform .18s}
.group.collapsed .groupchev{transform:rotate(-90deg)}
.group.collapsed .grid{display:none}
.azletter{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--accent-text);margin:20px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{display:block;border:1px solid var(--border);border-radius:12px;padding:14px 15px;background:var(--bg-panel);cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.cname{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--text)}
.ctag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-mut);white-space:nowrap}
.ctag .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.cdesc{font-size:13px;color:var(--text-soft);margin:0 0 10px;line-height:1.5}
.cbadges{display:flex;gap:5px;flex-wrap:wrap}
.b{font-size:10.5px;padding:1px 8px;border-radius:20px;background:var(--bg-soft);border:1px solid var(--border);color:var(--text-soft)}
.b.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.b.beta{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.b.dep{background:var(--err-soft);color:var(--err);border-color:transparent;text-decoration:line-through}
.b.ac{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
/* intent list */
.intentlist{display:flex;flex-direction:column;gap:10px}
.intentrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--border);border-radius:12px;padding:13px 16px;background:var(--bg-panel);color:var(--text);cursor:pointer}
.intentrow:hover{border-color:var(--accent)}
.intentrow .q{font-size:14.5px;font-weight:500}
.intentrow .els{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.intentrow .el{font-family:var(--mono);font-size:12px;padding:2px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text)}
.intentgo{font-size:12px;font-weight:600;color:var(--accent-text);white-space:nowrap}
.empty{text-align:center;color:var(--text-mut);padding:40px 0;font-size:14px}
@media(max-width:720px){
  .nav{display:none}.count{margin-left:0}
  .hero{padding:30px 0 24px}
  .catbar{align-items:flex-start;gap:10px}
  .filtergroup{width:100%;align-items:flex-start}
  .flabel{width:72px;padding-top:5px}
  .filteropts{flex:1}
  .modes{width:100%}.modes button{flex:1}
  .count{width:100%;text-align:right}
  .grouphead{padding:5px 0}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v6M12 9c0 4-4 4-4 9M12 9c0 4 4 4 4 9M8 18a1.4 1.4 0 1 0 0 .01M16 18a1.4 1.4 0 1 0 0 .01M12 3a1.4 1.4 0 1 0 0-.01"/></svg>
    Hydra Guide
  </div>
  <nav class="nav"><a href="playground.html">Playground</a><a href="learn.html">Learn</a><a href="guide.html" class="active">Guide</a><a href="migrate.html">Migrate</a></nav>
  <div class="spacer"></div>
  <button class="iconbtn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</div>

<div class="wrap">
  <div class="hero">
    <h1>Explore, edit and run every Hydra DSL element</h1>
    <p>The executable reference for Hydra. Search a name, browse a family, or describe what you want to do.</p>
    <div class="bigsearch">
      <span class="si"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
      <input id="search" placeholder="Search elements, or type an intent…" aria-label="Search the DSL">
      <span class="kk" id="searchKey">Ctrl K</span>
    </div>
    <div class="intentchips" id="intentChips"></div>
  </div>

  <div class="catbar">
    <div class="modes" role="group" aria-label="Navigation mode">
      <button class="on" data-mode="groups" aria-pressed="true">Groups</button>
      <button data-mode="az" aria-pressed="false">A–Z</button>
      <button data-mode="intent" aria-pressed="false">Intent</button>
    </div>
    <div class="filtergroup"><span class="flabel">category</span><div class="filteropts" id="catFilters"></div></div>
    <div class="filtergroup"><span class="flabel">status</span><div class="filteropts" id="statusFilters"></div></div>
    <div class="filtergroup"><span class="flabel">capability</span><div class="filteropts" id="capFilters"></div></div>
    <span class="count" id="count"></span>
  </div>

  <div id="catalog"></div>
</div>

<script>
var EL=[
 {n:"csv",c:"Sources",d:"Read rows from a CSV file.",b:["stable","batch","pushdown"]},
 {n:"json",c:"Sources",d:"Read records from JSON / NDJSON.",b:["stable","batch"]},
 {n:"parquet",c:"Sources",d:"Read columnar Parquet files.",b:["beta","batch","pushdown"]},
 {n:"postgresql",c:"Sources",d:"Read from a PostgreSQL table or query.",b:["stable","batch","pushdown"]},
 {n:"mysql",c:"Sources",d:"Read from MySQL / MariaDB.",b:["stable","batch","pushdown"]},
 {n:"mongodb",c:"Sources",d:"Read documents from MongoDB.",b:["beta","batch"]},
 {n:"web_api",c:"Sources",d:"Read from a REST API with pagination.",b:["beta","batch"]},
 {n:"csv",c:"Destinations",d:"Write rows to CSV with append or replace.",b:["stable","batch"]},
 {n:"json",c:"Destinations",d:"Write records to JSON with append or replace.",b:["stable","batch"]},
 {n:"parquet",c:"Destinations",d:"Write columnar Parquet output.",b:["beta","batch"]},
 {n:"postgresql",c:"Destinations",d:"Write with append, replace or upsert.",b:["stable","batch"]},
 {n:"mysql",c:"Destinations",d:"Write with append, replace or upsert.",b:["stable","batch"]},
 {n:"mongodb",c:"Destinations",d:"Write documents with append, replace or upsert.",b:["beta","batch"]},
 {n:"web_api",c:"Destinations",d:"Send output records to a Web API.",b:["beta","batch"]},
 {n:"filter",c:"Transforms",d:"Keep rows matching a boolean expression.",b:["stable","batch","pushdown"]},
 {n:"select",c:"Transforms",d:"Keep only some columns.",b:["stable","batch"]},
 {n:"rename",c:"Transforms",d:"Rename columns.",b:["stable","batch"]},
 {n:"cast",c:"Transforms",d:"Change column types.",b:["stable","batch"]},
 {n:"calculate",c:"Transforms",d:"Add a derived column.",b:["stable","batch"]},
 {n:"sort",c:"Transforms",d:"Order rows by columns.",b:["stable","batch"]},
 {n:"deduplicate",c:"Transforms",d:"Drop duplicate rows.",b:["stable","batch"]},
 {n:"aggregate",c:"Transforms",d:"Group and summarize.",b:["stable","batch"]},
 {n:"join",c:"Transforms",d:"Join another flow on a key.",b:["stable","batch"]},
 {n:"clean",c:"Transforms",d:"Trim, normalize, fix values.",b:["stable","batch"]},
 {n:"fill_null",c:"Transforms",d:"Replace null values.",b:["stable","batch"]},
 {n:"trim",c:"Transforms",d:"Strip whitespace from text.",b:["stable","batch"]},
 {n:"pivot",c:"Transforms",d:"Long to wide reshape.",b:["stable","batch"]},
 {n:"unpivot",c:"Transforms",d:"Wide to long reshape.",b:["stable","batch"]},
 {n:"transpose",c:"Transforms",d:"Swap rows and columns.",b:["stable","batch"]},
 {n:"merge",c:"Transforms",d:"Merge another source by key.",b:["stable","batch"]},
 {n:"union",c:"Transforms",d:"Append rows from multiple inputs.",b:["stable","batch"]},
 {n:"script",c:"Transforms",d:"Custom Python transform (sandboxed).",b:["beta","batch"]},
 {n:"job",c:"Workflows",d:"Execute a Hydra job as a workflow step.",b:["stable"]},
 {n:"action",c:"Workflows",d:"Execute a webhook, log or notification action.",b:["stable"]},
 {n:"depends_on",c:"Workflows",d:"Declare dependencies and parallel DAG branches.",b:["stable"]},
 {n:"when",c:"Workflows",d:"Run a step only when an expression is true.",b:["stable"]},
 {n:"on_failure",c:"Workflows",d:"Choose fail, skip or continue on failure.",b:["stable"]},
 {n:"manual",c:"Triggers",d:"Run a job on demand.",b:["stable"]},
 {n:"schedule",c:"Triggers",d:"Run on a cron schedule.",b:["stable"]},
 {n:"webhook",c:"Triggers",d:"Run when a webhook fires.",b:["stable"]},
 {n:"retry",c:"Policies",d:"Retry a failed step with fixed or exponential backoff.",b:["stable"]}];
var CATS=["Sources","Destinations","Transforms","Workflows","Triggers","Policies"];
var CATCOLOR={Sources:"#14b8a6",Destinations:"#22c55e",Transforms:"#8b5cf6",Workflows:"#f59e0b",Triggers:"#3b82f6",Policies:"#94a3b8"};
var STATUS=[["stable","Stable"],["beta","Beta"]];
var CAPS=[["batch","Batch"],["pushdown","Pushdown"]];
var BADGE={stable:["ok","Stable"],beta:["beta","Beta"],deprecated:["dep","Deprecated"],batch:["","Batch"],streaming:["","Streaming"],pushdown:["ac","Pushdown"]};
var INTENTS=[
 {q:"Read a CSV then filter rows",els:["csv","filter"],href:"playground.html?intent=csv-filter"},
 {q:"Write to PostgreSQL with upsert",els:["postgresql","mode: upsert"],href:"playground.html?intent=postgres-upsert"},
 {q:"Join two sources on a key",els:["join","right","on"],href:"playground.html?intent=join"},
 {q:"Aggregate then sort the result",els:["aggregate","sort"],href:"playground.html?intent=aggregate-sort"},
 {q:"Run two jobs in parallel",els:["depends_on","DAG"],href:"playground.html?intent=parallel-jobs"},
 {q:"Schedule a job every morning",els:["schedule","cron"],href:"playground.html?intent=schedule"},
 {q:"Retry a step on failure",els:["retry","backoff"],href:"playground.html?intent=retry"},
 {q:"Clean and deduplicate messy data",els:["clean","deduplicate"],href:"playground.html?intent=clean"},
 {q:"Reshape long data to wide",els:["pivot"],href:"playground.html?intent=pivot"}];

var state={mode:"groups",q:"",cats:{},statuses:{},caps:{},closed:{}};
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function cardHref(e){return e.n==="filter"&&e.c==="Transforms"?"fiche-filter.html":"#/guide/"+e.c.toLowerCase()+"/"+e.n;}

function cardHTML(e){
  var badges=e.b.map(function(k){var m=BADGE[k];return m?"<span class='b "+m[0]+"'>"+m[1]+"</span>":"";}).join("");
  return "<a class='card' href='"+cardHref(e)+"' data-n='"+e.n+"' data-c='"+e.c+"'><div class='card-h'><span class='cname'>"+e.n+
    "</span><span class='ctag'><span class='dot' style='background:"+CATCOLOR[e.c]+"'></span>"+e.c+"</span></div>"+
    "<p class='cdesc'>"+esc(e.d)+"</p><div class='cbadges'>"+badges+"</div></a>";
}
function match(e){
  if(Object.keys(state.cats).length&&!state.cats[e.c])return false;
  var statuses=Object.keys(state.statuses);
  if(statuses.length&&!statuses.some(function(k){return e.b.indexOf(k)>=0;}))return false;
  var caps=Object.keys(state.caps);
  if(caps.length&&!caps.some(function(k){return e.b.indexOf(k)>=0;}))return false;
  if(state.q){var q=state.q.toLowerCase();if((e.n+" "+e.d+" "+e.c).toLowerCase().indexOf(q)<0)return false;}
  return true;
}
function syncUrl(){
  var p=new URLSearchParams();if(state.mode!=="groups")p.set("view",state.mode);if(state.q)p.set("q",state.q);
  var cats=Object.keys(state.cats),statuses=Object.keys(state.statuses),caps=Object.keys(state.caps);
  if(cats.length)p.set("category",cats.join(","));if(statuses.length)p.set("status",statuses.join(","));if(caps.length)p.set("capability",caps.join(","));
  try{history.replaceState(null,"",location.pathname+(p.toString()?"?"+p.toString():""));}catch(_){}
}
function bindGroups(){
  document.querySelectorAll(".grouphead").forEach(function(h){h.onclick=function(){
    var cat=h.dataset.group,g=h.closest(".group"),closed=g.classList.toggle("collapsed");state.closed[cat]=closed;
    h.setAttribute("aria-expanded",String(!closed));
  };});
}
function render(){
  var host=$("catalog"),list=EL.filter(match);
  if(state.mode==="intent"){
    var q=state.q.toLowerCase();
    var its=INTENTS.filter(function(it){return !q||(it.q+" "+it.els.join(" ")).toLowerCase().indexOf(q)>=0;});
    host.innerHTML=its.length?"<div class='intentlist'>"+its.map(function(it){
      return "<a class='intentrow' href='"+it.href+"'><span class='q'>“"+esc(it.q)+"”</span><span class='els'>"+
        it.els.map(function(x){return "<span class='el'>"+x+"</span>";}).join("")+"</span><span class='intentgo'>Open in Playground →</span></a>";}).join("")+"</div>"
      :"<div class='empty'>No intent matches “"+esc(state.q)+"”.</div>";
    $("count").textContent=its.length+" intent"+(its.length===1?"":"s");
    syncUrl();
    return;
  }
  if(!list.length){host.innerHTML="<div class='empty'>No element matches your filters.</div>";$("count").textContent="0 elements";syncUrl();return;}
  var html="";
  if(state.mode==="groups"){
    CATS.forEach(function(cat){var g=list.filter(function(e){return e.c===cat;});if(!g.length)return;
      var closed=!!state.closed[cat];
      html+="<section class='group"+(closed?" collapsed":"")+"'><button class='grouphead' data-group='"+cat+"' aria-expanded='"+(!closed)+"'><span class='dot' style='background:"+CATCOLOR[cat]+"'></span>"+cat+" · "+g.length+"<span class='groupchev' aria-hidden='true'>⌄</span></button><div class='grid'>"+g.map(cardHTML).join("")+"</div></section>";});
  }else{
    var sorted=list.slice().sort(function(a,b){return a.n<b.n?-1:a.n>b.n?1:0;});
    var letter="";
    sorted.forEach(function(e){var l=e.n[0].toUpperCase();if(l!==letter){letter=l;html+="</div><div class='azletter'>"+letter+"</div><div class='grid'>";}html+=cardHTML(e);});
    html="<div class='grid'>"+html+"</div>";html=html.replace(/^<div class='grid'><\/div>/,"");
  }
  host.innerHTML=html;
  $("count").textContent=list.length+" element"+(list.length===1?"":"s");
  bindGroups();syncUrl();
  host.querySelectorAll('.card').forEach(function(c){c.onclick=function(e){
    var n=c.dataset.n,cat=c.dataset.c;
    if(n==="filter"&&cat==="Transforms")return;
    if(c.getAttribute("href").charAt(0)==="#"){e.preventDefault();alert("Mock: would open /guide/"+cat.toLowerCase()+"/"+n);}};});
}
function renderChips(){
  $("catFilters").innerHTML=CATS.map(function(c){return "<button type='button' class='fchip"+(state.cats[c]?" on":"")+"' data-cat='"+c+"' aria-pressed='"+!!state.cats[c]+"'>"+c+"</button>";}).join("");
  $("statusFilters").innerHTML=STATUS.map(function(c){return "<button type='button' class='fchip"+(state.statuses[c[0]]?" on":"")+"' data-status='"+c[0]+"' aria-pressed='"+!!state.statuses[c[0]]+"'>"+c[1]+"</button>";}).join("");
  $("capFilters").innerHTML=CAPS.map(function(c){return "<button type='button' class='fchip"+(state.caps[c[0]]?" on":"")+"' data-cap='"+c[0]+"' aria-pressed='"+!!state.caps[c[0]]+"'>"+c[1]+"</button>";}).join("");
  document.querySelectorAll('[data-cat]').forEach(function(el){el.onclick=function(){var c=el.dataset.cat;
    if(state.cats[c]){delete state.cats[c];el.classList.remove('on');}else{state.cats[c]=1;el.classList.add('on');}el.setAttribute("aria-pressed",String(!!state.cats[c]));render();};});
  document.querySelectorAll('[data-status]').forEach(function(el){el.onclick=function(){var c=el.dataset.status;
    if(state.statuses[c]){delete state.statuses[c];el.classList.remove('on');}else{state.statuses[c]=1;el.classList.add('on');}el.setAttribute("aria-pressed",String(!!state.statuses[c]));render();};});
  document.querySelectorAll('[data-cap]').forEach(function(el){el.onclick=function(){var c=el.dataset.cap;
    if(state.caps[c]){delete state.caps[c];el.classList.remove('on');}else{state.caps[c]=1;el.classList.add('on');}el.setAttribute("aria-pressed",String(!!state.caps[c]));render();};});
  $("intentChips").innerHTML=INTENTS.slice(0,4).map(function(it){return "<button type='button' class='ichip'><span class='a'>›</span> "+esc(it.q)+"</button>";}).join("");
  document.querySelectorAll('.ichip').forEach(function(el,i){el.onclick=function(){
    setMode('intent');$("search").value=INTENTS[i].q;state.q=INTENTS[i].q;render();$("search").focus();};});
}
function setMode(m){state.mode=m;document.querySelectorAll('.modes button').forEach(function(b){var on=b.dataset.mode===m;b.classList.toggle('on',on);b.setAttribute("aria-pressed",String(on));});
  document.querySelectorAll(".filtergroup").forEach(function(g){g.style.display=m==="intent"?"none":"";});}
document.querySelectorAll('.modes button').forEach(function(b){b.onclick=function(){setMode(b.dataset.mode);render();};});
$("search").addEventListener('input',function(){state.q=this.value;render();});
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$("search").focus();}});
$("themeBtn").onclick=function(){var h=document.documentElement,next=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',next);localStorage.setItem("hydra-theme",next);};
function loadState(){
  var p=new URLSearchParams(location.search),view=p.get("view");if(["groups","az","intent"].indexOf(view)>=0)state.mode=view;
  state.q=p.get("q")||"";$("search").value=state.q;
  (p.get("category")||"").split(",").filter(Boolean).forEach(function(x){if(CATS.indexOf(x)>=0)state.cats[x]=1;});
  (p.get("status")||"").split(",").filter(Boolean).forEach(function(x){if(STATUS.some(function(s){return s[0]===x;}))state.statuses[x]=1;});
  (p.get("capability")||"").split(",").filter(Boolean).forEach(function(x){if(CAPS.some(function(s){return s[0]===x;}))state.caps[x]=1;});
  if(innerWidth<=720)CATS.slice(1).forEach(function(c){state.closed[c]=true;});
}
var savedTheme=localStorage.getItem("hydra-theme");if(savedTheme)document.documentElement.setAttribute("data-theme",savedTheme);
$("searchKey").textContent=/Mac|iPhone|iPad/.test(navigator.platform)?"⌘K":"Ctrl K";
loadState();setMode(state.mode);renderChips();render();
</script>
</body>
</html>
