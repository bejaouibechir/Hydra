<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydra Studio — DSL builder (preview)</title>
<style>
:root{--bg-surface:#0f0f18;--bg-card:#1a1a2e;--bg-border:#2d2d4e;--bg-hover:#252540;--bg-input:#16213e;
--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;
--primary:#6366f1;--primary-hover:#4f46e5;--primary-subtle:rgba(99,102,241,.15);
--success:#10b981;--error:#ef4444;--warning:#f59e0b;--info:#3b82f6;--canvas-dot:rgba(255,255,255,.35);
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
html[data-theme="midnight"]{--bg-surface:#000;--bg-card:#0d0d0d;--bg-border:#1f1f1f;--bg-hover:#141414;--bg-input:#080808;
--text-primary:#f8fafc;--text-secondary:#a1a1aa;--text-muted:#71717a;--primary:#8b5cf6;--primary-hover:#7c3aed;
--primary-subtle:rgba(139,92,246,.15);--info:#3b82f6;--canvas-dot:rgba(255,255,255,.28)}
html[data-theme="ocean"]{--bg-surface:#020c18;--bg-card:#071428;--bg-border:#0e2540;--bg-hover:#0a1c35;--bg-input:#040e1e;
--text-primary:#e0f7fa;--text-secondary:#7ecfd8;--text-muted:#4a9ba8;--primary:#06b6d4;--primary-hover:#0891b2;
--primary-subtle:rgba(6,182,212,.15);--info:#22d3ee;--canvas-dot:rgba(14,200,220,.42)}
html[data-theme="light"]{--bg-surface:#f8fafc;--bg-card:#fff;--bg-border:#e2e8f0;--bg-hover:#f1f5f9;--bg-input:#f8fafc;
--text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;--primary:#4f46e5;--primary-hover:#4338ca;
--primary-subtle:rgba(79,70,229,.10);--success:#059669;--error:#dc2626;--warning:#d97706;--info:#2563eb;--canvas-dot:rgba(0,0,0,.45)}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;font-family:var(--sans);background:var(--bg-surface);color:var(--text-primary);font-size:14px}
button,input,select{font:inherit;color:inherit}
:where(button,input,select,[tabindex]):focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.app{display:flex;height:100vh}
/* ---------- sidebar ---------- */
.side{width:208px;flex-shrink:0;background:var(--bg-card);border-right:1px solid var(--bg-border);display:flex;flex-direction:column;transition:width .2s}
.side.col{width:56px}
.side .lg{display:flex;align-items:center;gap:8px;height:56px;padding:0 12px;border-bottom:1px solid var(--bg-border)}
.side .lg svg{width:28px;height:28px;color:var(--primary);flex-shrink:0}
.side .lg b{font-size:13px;letter-spacing:.08em;font-weight:700}
.side .lg .tg{margin-left:auto;background:none;border:0;color:var(--text-muted);cursor:pointer;padding:4px;border-radius:6px}
.side.col .lg b,.side.col .tg{display:none}
.side nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.side nav .gp{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);padding:10px 8px 4px;font-weight:700}
.side.col nav .gp{display:none}
.nav{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;color:var(--text-secondary);
  font-size:13px;font-weight:500;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.nav:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav.on{background:var(--primary-subtle);color:var(--primary)}
.nav svg{width:16px;height:16px;flex-shrink:0}
.nav .lk{margin-left:auto;width:12px;height:12px;color:var(--text-muted)}
.nav.lock{color:var(--text-muted)}
.side.col .nav span{display:none}
.side .foot{padding:10px 8px;border-top:1px solid var(--bg-border)}
.dl{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px;border-radius:9px;
  background:var(--primary);color:#fff;border:0;font-size:12.5px;font-weight:600;cursor:pointer}
.dl:hover{background:var(--primary-hover)}
.side.col .dl span{display:none}
/* ---------- topbar ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--bg-card);border-bottom:1px solid var(--bg-border)}
.top h1{font-size:13.5px;font-weight:600;margin:0}
.top .crumb{color:var(--text-muted);font-size:12.5px;font-family:var(--mono)}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:20px;
  background:var(--bg-input);border:1px solid var(--bg-border);color:var(--text-secondary)}
.chip.warn{color:var(--warning);border-color:var(--warning);background:rgba(245,158,11,.1)}
.chip svg{width:12px;height:12px}
.iconbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:none;border:1px solid var(--bg-border);
  color:var(--text-secondary);cursor:pointer}
.iconbtn:hover{background:var(--bg-hover);color:var(--text-primary)}
.iconbtn svg{width:15px;height:15px}
/* ---------- body 3 colonnes ---------- */
.body{flex:1;display:grid;grid-template-columns:236px 1fr 340px;min-height:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.col.l{background:var(--bg-card);border-right:1px solid var(--bg-border)}
.col.r{background:var(--bg-card);border-left:1px solid var(--bg-border)}
.ch{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--bg-border);flex-shrink:0}
.ch h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);font-weight:700;margin:0}
.ch .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-muted)}
.ch .ct.full{color:var(--warning)}
.scroll{flex:1;overflow:auto;padding:10px 11px}
/* ---------- palette ---------- */
.pal{display:grid;gap:7px;margin-bottom:14px}
.pi{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;background:var(--bg-input);
  border:1px solid var(--bg-border);cursor:pointer;text-align:left;width:100%}
.pi:hover:not(:disabled){border-color:var(--primary);background:var(--bg-hover)}
.pi:disabled{opacity:.45;cursor:not-allowed}
.pi .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex-shrink:0}
.pi .ic svg{width:13px;height:13px}
.pi b{font-size:12.5px;font-weight:600;display:block}
.pi small{font-size:10.5px;color:var(--text-muted)}
.pi .lk{margin-left:auto;width:12px;height:12px;color:var(--text-muted);flex-shrink:0}
/* liste des steps */
.sl{display:grid;gap:6px}
.si{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;background:var(--bg-input);
  border:1px solid var(--bg-border);cursor:pointer;font-size:12.5px}
.si:hover{border-color:var(--primary)}
.si.on{border-color:var(--primary);background:var(--primary-subtle)}
.si .dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.si .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.si .x{background:none;border:0;color:var(--text-muted);cursor:pointer;padding:2px;border-radius:4px;line-height:1}
.si .x:hover{color:var(--error)}
.empty{font-size:12px;color:var(--text-muted);padding:14px 4px;text-align:center;line-height:1.5}
/* ---------- canvas ---------- */
.canvas{flex:1;position:relative;overflow:auto;background:var(--bg-surface);
  background-image:radial-gradient(var(--canvas-dot) 1px,transparent 1px);background-size:18px 18px}
.stagewrap{position:relative;min-width:100%;min-height:100%}
.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:absolute;width:192px;border-radius:12px;background:var(--bg-card);border:1px solid var(--bg-border);
  padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;user-select:none}
html[data-theme="light"] .node{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.node.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-subtle)}
.node .row{display:flex;align-items:center;gap:9px}
.node .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex-shrink:0}
.node .ic svg{width:13px;height:13px}
.node .tx{min-width:0;flex:1}
.node .tx p{margin:0;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .tx small{font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.node .tx small.miss{color:var(--warning)}
.node .h{position:absolute;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;border:2px solid var(--bg-card)}
.node .h.l{left:-5px}.node .h.r{right:-5px}
.node .badge{margin-top:6px;font-size:10.5px;padding:2px 6px;border-radius:5px;display:inline-block}
.stagelab{position:absolute;font-size:10px;font-family:var(--mono);color:var(--text-muted);letter-spacing:.05em}
/* ---------- inspecteur ---------- */
.fld{margin-bottom:11px}
.fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:700;margin-bottom:4px}
.fld input,.fld select{width:100%;padding:7px 9px;border-radius:7px;background:var(--bg-input);border:1px solid var(--bg-border);font-size:12.5px}
.fld input:focus,.fld select:focus{border-color:var(--primary)}
.deps{display:flex;flex-wrap:wrap;gap:5px}
.dep{font-size:11.5px;padding:4px 9px;border-radius:14px;border:1px solid var(--bg-border);background:var(--bg-input);
  color:var(--text-secondary);cursor:pointer}
.dep.on{background:var(--primary-subtle);border-color:var(--primary);color:var(--primary)}
.ops{display:grid;gap:5px;margin-bottom:8px}
.op{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;background:var(--bg-input);border:1px solid var(--bg-border);font-size:12px}
.op .on2{flex:1;font-family:var(--mono);font-size:11.5px}
.op .mv{background:none;border:0;color:var(--text-muted);cursor:pointer;padding:1px 3px;line-height:1;font-size:11px}
.op .mv:hover{color:var(--primary)}
.addop{display:flex;gap:6px}
.addop select{flex:1}
.mini{padding:6px 11px;border-radius:7px;background:var(--bg-input);border:1px solid var(--bg-border);font-size:12px;cursor:pointer}
.mini:hover:not(:disabled){border-color:var(--primary)}
.mini:disabled{opacity:.45;cursor:not-allowed}
.mini.p{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.mini.p:hover{background:var(--primary-hover)}
/* ---------- yaml ---------- */
.tabs{display:flex;gap:4px;padding:8px 11px 0;border-bottom:1px solid var(--bg-border);flex-shrink:0;overflow:auto}
.tab{padding:6px 11px;border-radius:7px 7px 0 0;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--text-muted);font-size:11.5px;font-family:var(--mono);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);background:var(--bg-input)}
pre.yml{flex:1;margin:0;padding:11px 13px;overflow:auto;background:var(--bg-surface);font-family:var(--mono);
  font-size:11.5px;line-height:1.65;white-space:pre}
.yk{color:var(--primary)}.ys{color:var(--success)}.yc{color:var(--text-muted);font-style:italic}
/* ---------- validation ---------- */
.diag{border-top:1px solid var(--bg-border);flex-shrink:0;max-height:150px;overflow:auto}
.dg{display:flex;gap:8px;align-items:flex-start;padding:8px 13px;font-size:12px;border-bottom:1px solid var(--bg-border)}
.dg:last-child{border-bottom:0}
.dg .sv{width:6px;height:6px;border-radius:50%;margin-top:6px;flex-shrink:0}
.dg.err .sv{background:var(--error)}.dg.warn .sv{background:var(--warning)}.dg.ok .sv{background:var(--success)}
.dg b{font-family:var(--mono);font-size:11.5px;font-weight:600}
.dg span{color:var(--text-secondary)}
/* ---------- funnel ---------- */
.gate{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
.gate.on{display:flex}
.gbox{width:min(520px,96vw);background:var(--bg-card);border:1px solid var(--bg-border);border-radius:14px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.5)}
.gh{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--bg-border)}
.gh .ic{width:32px;height:32px;border-radius:9px;background:var(--primary-subtle);display:grid;place-items:center}
.gh .ic svg{width:16px;height:16px;color:var(--primary)}
.gh h3{margin:0;font-size:15px;font-weight:600}
.gh small{color:var(--text-muted);font-size:12px}
.gh .x{margin-left:auto;background:none;border:0;color:var(--text-muted);font-size:19px;cursor:pointer;line-height:1}
.gb{padding:15px 17px}
.gb p{margin:0 0 11px;font-size:13.5px;color:var(--text-secondary);line-height:1.55}
.gb pre{margin:0;padding:11px 13px;border-radius:9px;background:var(--bg-input);border:1px solid var(--bg-border);
  font-family:var(--mono);font-size:11.5px;line-height:1.65;overflow:auto;white-space:pre;max-height:210px}
.gf{display:flex;gap:9px;padding:13px 17px;border-top:1px solid var(--bg-border);flex-wrap:wrap}
.gf .sp{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--bg-card);
  border:1px solid var(--bg-border);color:var(--text-primary);padding:9px 16px;border-radius:9px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .18s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1}
@media(max-width:1100px){.body{grid-template-columns:200px 1fr 300px}}
@media(max-width:900px){.body{grid-template-columns:1fr}.col.l,.col.r{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="lg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v6M12 9l-5 4M12 9l5 4M7 13v5M17 13v5M12 15v3"/><circle cx="12" cy="3" r="1.7" fill="currentColor"/><circle cx="7" cy="19" r="1.7" fill="currentColor"/><circle cx="12" cy="19" r="1.7" fill="currentColor"/><circle cx="17" cy="19" r="1.7" fill="currentColor"/></svg>
      <b>HYDRA</b>
      <button class="tg" id="collapse" aria-label="Collapse sidebar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>
    <nav id="nav"></nav>
    <div class="foot">
      <button class="dl" id="dlSide"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M8 11l4 4 4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg><span>Get Hydra</span></button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <h1>Workflow editor</h1>
      <span class="crumb" id="crumb">demo_project / orders_pipeline</span>
      <span class="sp"></span>
      <span class="chip warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>Design only — nothing runs here</span>
      <button class="iconbtn" id="runBtn" title="Run" aria-label="Run"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6,4 20,12 6,20"/></svg></button>
      <button class="iconbtn" id="saveBtn" title="Save" aria-label="Save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
      <select class="chip" id="theme" aria-label="Theme" style="cursor:pointer">
        <option value="dark">Hydra Dark</option><option value="midnight">Midnight</option>
        <option value="ocean">Ocean</option><option value="light">Hydra Light</option>
      </select>
    </header>

    <div class="body">
      <div class="col l">
        <div class="ch"><h2>Add a step</h2></div>
        <div class="scroll">
          <div class="pal" id="pal"></div>
          <div class="ch" style="padding:0 0 8px;border:0"><h2>Steps</h2><span class="ct" id="stepCt"></span></div>
          <div class="sl" id="steps"></div>
        </div>
      </div>

      <div class="col">
        <div class="canvas" id="canvas"><div class="stagewrap" id="stage"><svg class="edges" id="edges"></svg></div></div>
      </div>

      <div class="col r">
        <div class="tabs" id="tabs"></div>
        <div id="paneInspect" class="scroll"></div>
        <pre class="yml" id="paneYaml" style="display:none"></pre>
        <div class="diag" id="diag"></div>
      </div>
    </div>
  </div>
</div>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateT">
  <div class="gbox">
    <div class="gh"><div class="ic" id="gateIc"></div><div><h3 id="gateT">—</h3><small id="gateS">—</small></div>
      <button class="x" id="gateX" aria-label="Close">×</button></div>
    <div class="gb"><p id="gateP"></p><pre id="gateC"></pre></div>
    <div class="gf"><button class="mini" id="gateCopy">Copy</button><span class="sp"></span>
      <button class="mini" id="gateBack">Keep designing</button>
      <button class="mini p" id="gateGo">Download Hydra →</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function addStep(t){
  if(ST.steps.length>=LIM.steps){gate('limit');return}
  var base=t,i=1,n=base;while(ST.steps.some(function(s){return s.n===n}))n=base+'_'+(++i);
  var last=ST.steps[ST.steps.length-1];
  var s={n:n,t:t,deps:last?[last.n]:[]};
  if(t==='action'){s.action='shell';s.cmd='echo hello'}
  ST.steps.push(s);
  if(t==='job')ST.jobs[n]={src:{t:'csv',p:''},ops:[],dst:{t:'parquet',p:''}};
  ST.sel=n;draw();
}
function delStep(n){
  ST.steps=ST.steps.filter(function(s){return s.n!==n});
  ST.steps.forEach(function(s){s.deps=s.deps.filter(function(d){return d!==n})});
  delete ST.jobs[n];if(ST.sel===n)ST.sel=ST.steps.length?ST.steps[0].n:null;draw();
}

var NW=192,NH=64,GX=88,GY=30,PX=26,PY=34;
function layout(){
  var by={},seen={};ST.steps.forEach(function(s){by[s.n]=s});
  function dep(s,st){if(seen[s.n]!=null)return seen[s.n];if(st[s.n])return 0;st[s.n]=1;
    var d=0;s.deps.forEach(function(p){if(by[p])d=Math.max(d,dep(by[p],st)+1)});delete st[s.n];return seen[s.n]=d}
  ST.steps.forEach(function(s){s.d=dep(s,{})});
  var byd={};ST.steps.forEach(function(s){(byd[s.d]=byd[s.d]||[]).push(s)});
  var cols=Object.keys(byd).sort(function(a,b){return a-b}).map(function(k){return byd[k]});
  cols.forEach(function(c,x){c.forEach(function(s,y){s.x=x;s.y=y;s.rows=c.length})});
  return cols;
}
function px(s,rows){return {x:PX+s.x*(NW+GX),y:PY+s.y*(NH+GY)+(rows-s.rows)*(NH+GY)/2}}
function drawCanvas(){
  var cols=layout(),by={};ST.steps.forEach(function(s){by[s.n]=s});
  var rows=Math.max(1,Math.max.apply(null,cols.map(function(c){return c.length})));
  var W=PX*2+cols.length*NW+Math.max(0,cols.length-1)*GX, H=PY+rows*NH+Math.max(0,rows-1)*GY+PX;
  var st=$("stage");st.style.width=W+'px';st.style.height=H+'px';
  var e='<defs><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">'+
        '<path d="M0,0 L6,3 L0,6 z" fill="var(--bg-border)"/></marker>'+
        '<marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">'+
        '<path d="M0,0 L6,3 L0,6 z" fill="var(--error)"/></marker></defs>';
  cols.forEach(function(c,x){e+='<text class="stagelab" x="'+(PX+x*(NW+GX))+'" y="18" style="font-size:10px;fill:var(--text-muted);font-family:var(--mono)">stage '+(x+1)+'</text>'});
  var broken=0;
  ST.steps.forEach(function(t){t.deps.forEach(function(p){
    var f=by[p],a=px(t,rows);
    if(!f){broken++;e+='<path d="M'+(a.x-GX+18)+','+(a.y+NH/2)+' L'+(a.x-7)+','+(a.y+NH/2)+'" stroke="var(--error)" stroke-width="1.7" stroke-dasharray="4 3" fill="none" marker-end="url(#a2)"/>'+
      '<text x="'+(a.x-GX+14)+'" y="'+(a.y+NH/2-7)+'" text-anchor="end" style="font-size:10px;fill:var(--error);font-family:var(--mono)">'+esc(p)+' ?</text>';return}
    var b=px(f,rows),x1=b.x+NW,y1=b.y+NH/2,x2=a.x-7,y2=a.y+NH/2,m=(x1+x2)/2;
    e+='<path d="M'+x1+','+y1+' C'+m+','+y1+' '+m+','+y2+' '+x2+','+y2+'" stroke="var(--bg-border)" stroke-width="1.7" fill="none" marker-end="url(#a1)"/>';
  })});
  $("edges").innerHTML=e;
  [].slice.call(st.querySelectorAll('.node')).forEach(function(n){n.remove()});
  ST.steps.forEach(function(s){
    var p=px(s,rows),c=COL[s.t]||'var(--text-muted)',sf=SOFT[s.t]||'var(--bg-hover)';
    var j=ST.jobs[s.n],sub=s.t==='job'?(j&&j.dst&&j.dst.p?'./jobs/'+s.n+'.yaml':'no destination set'):(s.t==='action'?(s.cmd||'action'):'if / else');
    var miss=s.t==='job'&&!(j&&j.dst&&j.dst.p);
    var d=document.createElement('div');
    d.className='node'+(ST.sel===s.n?' on':'');d.style.left=p.x+'px';d.style.top=p.y+'px';d.dataset.n=s.n;d.setAttribute('tabindex','0');
    d.innerHTML='<span class="h l" style="background:'+c+'"></span><span class="h r" style="background:'+c+'"></span>'+
      '<div class="row"><span class="ic" style="background:'+sf+';color:'+c+'">'+svg(s.t)+'</span>'+
      '<span class="tx"><p>'+esc(s.n)+'</p><small'+(miss?' class="miss"':'')+'>'+esc(sub)+'</small></span></div>';
    st.appendChild(d);
  });
  return broken;
}

/* ================= GÉNÉRATION DU DSL ================= */
function q(s){return '"'+String(s).replace(/"/g,'\\"')+'"'}
function wfYaml(){
  var o=['version: "1.0"','workflow:','  name: '+ST.name];
  o.push('  trigger:');
  if(ST.cron){o.push('    type: schedule','    cron: '+q(ST.cron))}else o.push('    type: manual');
  o.push('  steps:');
  ST.steps.forEach(function(s){
    o.push('    - name: '+s.n,'      type: '+(s.t==='condition'?'condition':s.t));
    if(s.t==='job')o.push('      job: "./jobs/'+s.n+'.yaml"');
    if(s.t==='action'){o.push('      action: '+(s.action||'shell'),'      params:','        command: '+q(s.cmd||''))}
    if(s.deps.length)o.push('      depends_on: ['+s.deps.map(q).join(', ')+']');
  });
  return o.join('\n');
}
function jobYaml(n){
  var j=ST.jobs[n];if(!j)return '# no job configured';
  var o=['name: '+n,'','source:'];
  if(/mysql|postgres|mongodb/.test(j.src.t)){o.push('  type: '+j.src.t,'  conn: ${SECRET.SRC}','  query: '+q(j.src.p||'SELECT 1'))}
  else if(j.src.t==='webapi'){o.push('  type: webapi','  url: '+q(j.src.p||''),'  method: GET')}
  else o.push('  type: '+j.src.t,'  path: '+q(j.src.p||'???'));
  o.push('','transformations:');
  if(!j.ops.length)o.push('  []               # pass-through');
  else j.ops.forEach(function(x){o.push('  - op: '+x.op);if(x.p)o.push('    params: '+opParam(x))});
  o.push('','destination:');
  if(/mysql|postgres/.test(j.dst.t))o.push('  type: '+j.dst.t,'  table: '+q(j.dst.p||'???'),'  mode: replace');
  else o.push('  type: '+j.dst.t,'  path: '+q(j.dst.p||'???'),'  mode: replace');
  return o.join('\n');
}
function opParam(x){
  var v=x.p||'';
  if(x.op==='filter')return '{expr: '+q(v)+'}';
  if(x.op==='select')return '{columns: ['+v.split(',').map(function(s){return s.trim()}).filter(Boolean).join(', ')+']}';
  if(x.op==='deduplicate')return '{keys: ['+v.split(',').map(function(s){return s.trim()}).filter(Boolean).join(', ')+']}';
  if(x.op==='sort')return '{by: ['+v+'], order: asc}';
  if(x.op==='aggregate')return '{by: ['+v+'], agg: {}}';
  if(x.op==='rename')return '{map: {'+v+'}}';
  if(x.op==='cast')return '{types: {'+v+'}}';
  if(x.op==='fill_null')return '{values: {'+v+'}}';
  return '{path: '+q(v)+'}';
}
function colorYaml(t){return esc(t).split('\n').map(function(l){
  if(/^\s*#/.test(l))return '<span class="yc">'+l+'</span>';
  var st=[],cm=null;
  l=l.replace(/"[^"]*"/g,function(m){st.push(m);return '\u0001'+(st.length-1)+'\u0001'});
  l=l.replace(/#.*$/,function(m){cm=m;return '\u0002'});
  l=l.replace(/^(\s*(?:- )?)([\w_]+)(:)/,'$1<span class="yk">$2</span>$3');
  if(cm!==null)l=l.replace('\u0002','<span class="yc">'+cm+'</span>');
  return l.replace(/\u0001(\d+)\u0001/g,function(_,i){return '<span class="ys">'+st[+i]+'</span>'})}).join('\n')}

    var j=ST.jobs[s.n];if(!j)return;
    var u=e.target.closest('[data-up]'),dn=e.target.closest('[data-dn]'),rm=e.target.closest('[data-rm]');
    if(u){var i=+u.dataset.up;if(i>0){var t=j.ops[i];j.ops[i]=j.ops[i-1];j.ops[i-1]=t;draw()}}
    else if(dn){var i=+dn.dataset.dn;if(i<j.ops.length-1){var t=j.ops[i];j.ops[i]=j.ops[i+1];j.ops[i+1]=t;draw()}}
    else if(rm){j.ops.splice(+rm.dataset.rm,1);draw()}
  },{once:true});
}

/* ================= VALIDATION ================= */
function diagnose(broken){
  var d=[],names={};ST.steps.forEach(function(s){names[s.n]=1});
  ST.steps.forEach(function(s){
    s.deps.forEach(function(p){if(!names[p])d.push(['err',s.n,'depends on "'+p+'", which is not a step in this workflow'])});
    if(s.t==='job'){var j=ST.jobs[s.n]||{};
      if(!j.src||!j.src.p)d.push(['warn',s.n,'source has no path or query yet']);
      if(!j.dst||!j.dst.p)d.push(['warn',s.n,'destination is not named — a job must say where it writes']);}
    if(s.t==='action'&&!s.cmd)d.push(['warn',s.n,'action has no command']);
    if(s.t==='condition'&&s.deps.length===0)d.push(['warn',s.n,'a condition with no upstream step always evaluates the same way']);
  });
  var seen={},cyc=false;
  (function(){var by={};ST.steps.forEach(function(s){by[s.n]=s});
    ST.steps.forEach(function(s){(function walk(x,st){if(st[x.n]){cyc=true;return}st[x.n]=1;
      x.deps.forEach(function(p){if(by[p])walk(by[p],st)});delete st[x.n]})(s,{})})})();
  if(cyc)d.push(['err','workflow','circular dependency — a run would never start']);
  if(!ST.steps.length)d.push(['warn','workflow','no step yet']);
  if(!d.length)d.push(['ok',ST.name,ST.steps.length+' steps, '+Object.keys(ST.jobs).length+' job manifests — ready to run locally']);
  $("diag").innerHTML=d.slice(0,6).map(function(x){
    return '<div class="dg '+x[0]+'"><span class="sv"></span><span><b>'+esc(x[1])+'</b> <span>'+esc(x[2])+'</span></span></div>'}).join('');
}

/* ================= BOUCLE ================= */
function draw(){
  renderPal();renderSteps();renderTabs();
  var broken=drawCanvas();
  if(ST.tab==='inspect'){$("paneInspect").style.display='';$("paneYaml").style.display='none';renderInspect()}
  else{$("paneInspect").style.display='none';$("paneYaml").style.display='';
    $("paneYaml").innerHTML=colorYaml(ST.tab==='wf'?wfYaml():jobYaml(ST.sel))}
  $("crumb").textContent='demo_project / '+ST.name;
  diagnose(broken);
}
seed();draw();
</script>
