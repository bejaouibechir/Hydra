<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow view — prototype</title>
<style>
:root{--bg:#fff;--bg-soft:#f6f8f8;--bg-panel:#fff;--bg-code:#f4f6f6;
--text:#0e1a17;--text-soft:#5a6a66;--text-mut:#8a9793;--border:#e2e8e6;--border-strong:#cdd8d5;
--accent:#0f766e;--accent-soft:#d7efeb;--accent-text:#0b5850;--ok:#15803d;--ok-soft:#dcf3e3;
--warn:#b45309;--warn-soft:#fbedd8;--err:#b91c1c;--err-soft:#fbe4e4;--rival:#0a7fa8;--rival-soft:#dcf0f8;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
html[data-theme="dark"]{--bg:#0d1412;--bg-soft:#111b18;--bg-panel:#131f1b;--bg-code:#0b1310;
--text:#e7efec;--text-soft:#9db0aa;--text-mut:#6f827c;--border:#20302b;--border-strong:#2c413a;
--accent:#2dd4bf;--accent-soft:#123a34;--accent-text:#7bead9;--ok:#4ade80;--ok-soft:#12331f;
--warn:#fbbf24;--warn-soft:#3a2c0e;--err:#f87171;--err-soft:#3a1616;--rival:#38bdf8;--rival-soft:#0c2c3d;}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button,select,textarea{font:inherit}
:where(button,select,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px clamp(12px,3vw,22px) 60px}
h1{font-size:23px;font-weight:600;margin:0 0 4px;letter-spacing:-.015em}
.sub{color:var(--text-soft);font-size:14px;margin:0 0 16px}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar select{padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg-panel);color:var(--text);font-size:13.5px}
.bar .tag{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--text-mut)}
.btn{padding:7px 13px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-panel);color:var(--text);font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:12px;align-items:start}
.pane{border:1px solid var(--border);border-radius:12px;background:var(--bg-panel);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pane.out{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ph{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-soft);font-size:12.5px;font-weight:600}
.ph .fn{font-family:var(--mono);font-weight:500;color:var(--text-soft);font-size:11px}
textarea{flex:1;border:0;outline:0;resize:none;padding:10px 12px;font-family:var(--mono);font-size:11.8px;line-height:1.6;
  background:var(--bg-code);color:var(--text);white-space:pre;overflow:auto;min-height:430px}
.stage{padding:10px;background:var(--bg-code);min-height:430px;overflow:auto}
svg.wf{display:block;width:100%;height:auto}
svg.wf text{font-family:var(--sans);fill:var(--text)}
svg.wf .nm{font-size:12px;font-weight:600}
svg.wf .ty{font-size:9.5px;font-family:var(--mono);fill:var(--text-mut);text-transform:uppercase;letter-spacing:.05em}
svg.wf .sb{font-size:10px;font-family:var(--mono);fill:var(--text-mut)}
svg.wf .lyl{font-size:9.5px;fill:var(--text-mut);font-family:var(--mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.err{margin:10px 0 0;padding:9px 12px;border:1px solid var(--err);background:var(--err-soft);color:var(--err);border-radius:9px;font-size:13px;display:none}
.err.on{display:block}
@media(max-width:820px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Workflow view — read-only</h1>
<p class="sub">No React Flow, no editor. It reads the YAML your migration tunnel already produces and draws it. Edit the left pane and watch.</p>
<div class="bar">
  <select id="ex" aria-label="Example workflow"></select>
  <button class="btn" id="theme">Theme</button>
  <span class="tag" id="stat"></span>
</div>
<div class="two">
  <div class="pane"><div class="ph"><span style="width:8px;height:8px;border-radius:2px;background:var(--rival);display:inline-block"></span>Input<span class="fn" id="fn">workflow.yaml</span></div>
    <textarea id="src" spellcheck="false" aria-label="Workflow YAML"></textarea></div>
  <div class="pane out"><div class="ph"><span style="width:8px;height:8px;border-radius:2px;background:var(--accent);display:inline-block"></span>Rendered<span class="fn" id="cnt"></span></div>
    <div class="stage"><svg class="wf" id="svg" role="img" aria-label="Workflow diagram"></svg></div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>job</span>
      <span><i style="background:var(--rival)"></i>action</span>
      <span><i style="background:var(--warn)"></i>condition</span>
      <span><i style="background:var(--err)"></i>broken dependency</span>
    </div>
  </div>
</div>
<div class="err" id="err"></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
/* ============================================================
   1. LECTURE  —  extrait name / type / depends_on des steps
   ============================================================ */
function parseWorkflow(text){
  var L=text.split('\n'),steps=[],cur=null,wf=null,cron=null;
  for(var i=0;i<L.length;i++){
    var ln=L[i],m;
    if(m=/^\s{0,4}name:\s*(\S.*)$/.exec(ln)){ if(!wf&&!cur) wf=m[1].trim(); }
    if(m=/^\s*cron:\s*["']?([^"'\n]+)["']?/.exec(ln)) cron=m[1].trim();
    if(m=/^\s*-\s*name:\s*(\S.*)$/.exec(ln)){ cur={n:m[1].trim(),t:'job',sub:'',deps:[],l:i+1}; steps.push(cur); continue; }
    if(!cur) continue;
    if(m=/^\s*type:\s*(\w+)/.exec(ln)) cur.t=m[1];
    if(m=/^\s*(?:job|action|command):\s*["']?([^"'\n]+)["']?/.exec(ln)) cur.sub=m[1].trim();
    if(m=/^\s*depends_on:\s*\[([^\]]*)\]/.exec(ln))
      cur.deps=m[1].split(',').map(function(s){return s.replace(/["'\s]/g,'')}).filter(Boolean);
  }
  return {name:wf||'workflow',cron:cron,steps:steps};
}

/* ============================================================
   2. DISPOSITION  —  profondeur = longueur du plus long chemin
   ============================================================ */
var CYCLES=[];
function layout(steps){
  var by={},seen={};CYCLES=[];
  steps.forEach(function(s){by[s.n]=s});
  function depth(s,stack){
    if(seen[s.n]!=null)return seen[s.n];
    if(stack[s.n]){CYCLES.push(s.n);return 0;}    /* cycle : on coupe et on le signale */
    stack[s.n]=1;
    var d=0;
    s.deps.forEach(function(p){ if(by[p]) d=Math.max(d,depth(by[p],stack)+1); });
    delete stack[s.n];
    return seen[s.n]=d;
  }
  steps.forEach(function(s){s.d=depth(s,{})});
  var byd={};
  steps.forEach(function(s){ (byd[s.d]=byd[s.d]||[]).push(s) });
  var cols=Object.keys(byd).sort(function(a,b){return a-b}).map(function(k){return byd[k]});
  cols.forEach(function(c,x){ c.forEach(function(s,y){ s.x=x; s.y=y; s.rows=c.length }) });
  return cols;
}

/* ============================================================
   3. DESSIN  —  boîtes, flèches, dépendances cassées en rouge
   ============================================================ */
var W=176,H=54,GX=64,GY=26,PAD=16;
function render(wf){
  var cols=layout(wf.steps),by={};
  wf.steps.forEach(function(s){by[s.n]=s});
  var rows=Math.max(1,Math.max.apply(null,cols.map(function(c){return c.length})));
  var wpx=PAD*2+cols.length*W+(cols.length-1)*GX;
  var hpx=PAD*2+22+rows*H+(rows-1)*GY;
  function cx(s){return PAD+s.x*(W+GX)}
  function cy(s){return PAD+22+s.y*(H+GY)+(rows-s.rows)*(H+GY)/2}
  var col={job:'var(--accent)',action:'var(--rival)',condition:'var(--warn)'};
  var soft={job:'var(--accent-soft)',action:'var(--rival-soft)',condition:'var(--warn-soft)'};
  var s='<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">'+
        '<path d="M0,0 L6,3 L0,6 z" fill="var(--border-strong)"/></marker>'+
        '<marker id="arx" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">'+
        '<path d="M0,0 L6,3 L0,6 z" fill="var(--err)"/></marker></defs>';
  cols.forEach(function(c,x){
    s+='<text class="lyl" x="'+(PAD+x*(W+GX))+'" y="12">stage '+(x+1)+'</text>';
  });
  var broken=0;
  wf.steps.forEach(function(t){
    t.deps.forEach(function(p){
      var f=by[p];
      if(!f){                                     /* règle 3 : jamais de silence */
        broken++;
        var bx=cx(t)-GX+10,byy=cy(t)+H/2;
        s+='<path d="M'+bx+','+byy+' L'+(cx(t)-6)+','+byy+'" stroke="var(--err)" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arx)"/>';
        s+='<text class="sb" x="'+(bx-4)+'" y="'+(byy-6)+'" text-anchor="end" fill="var(--err)">'+esc(p)+' ?</text>';
        return;
      }
      var x1=cx(f)+W,y1=cy(f)+H/2,x2=cx(t)-8,y2=cy(t)+H/2,mid=(x1+x2)/2;
      s+='<path d="M'+x1+','+y1+' C'+mid+','+y1+' '+mid+','+y2+' '+x2+','+y2+
         '" stroke="var(--border-strong)" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>';
    });
  });
  wf.steps.forEach(function(n){
    var c=col[n.t]||'var(--text-mut)',bg=soft[n.t]||'var(--bg-soft)';
    s+='<g><rect x="'+cx(n)+'" y="'+cy(n)+'" width="'+W+'" height="'+H+'" rx="9" fill="'+bg+'" stroke="'+c+'" stroke-width="1.6"/>'+
       '<rect x="'+cx(n)+'" y="'+cy(n)+'" width="4" height="'+H+'" rx="2" fill="'+c+'"/>'+
       '<text class="ty" x="'+(cx(n)+13)+'" y="'+(cy(n)+17)+'">'+esc(n.t)+'</text>'+
       '<text class="nm" x="'+(cx(n)+13)+'" y="'+(cy(n)+33)+'">'+esc(cut(n.n,22))+'</text>'+
       (n.sub?'<text class="sb" x="'+(cx(n)+13)+'" y="'+(cy(n)+46)+'">'+esc(cut(n.sub,26))+'</text>':'')+
       '</g>';
  });
  return {svg:s,w:wpx,h:hpx,stages:cols.length,broken:broken,cycles:CYCLES.slice()};
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function cut(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}

/* ---------- exemples (sorties réelles des tunnels de migration) ---------- */
var EX=[
{n:'Airbyte — 3 streams en parallèle',f:'workflows/raw_ingestion.yaml',s:
'version: "1.0"\n'+
'workflow:\n'+
'  name: raw_ingestion\n'+
'  trigger:\n'+
'    type: schedule\n'+
'    cron: "0 2 * * *"\n'+
'  steps:\n'+
'    - name: load_raw_orders\n'+
'      type: job\n'+
'      job: "./jobs/load_raw_orders.yaml"\n'+
'    - name: load_raw_customers\n'+
'      type: job\n'+
'      job: "./jobs/load_raw_customers.yaml"\n'+
'    - name: load_raw_products\n'+
'      type: job\n'+
'      job: "./jobs/load_raw_products.yaml"\n'},
{n:'dbt — charger, construire, tester',f:'workflows/acme_analytics.yaml',s:
'version: "1.0"\n'+
'workflow:\n'+
'  name: acme_analytics\n'+
'  trigger:\n'+
'    type: schedule\n'+
'    cron: "0 2 * * *"\n'+
'  steps:\n'+
'    - name: load_raw_orders\n'+
'      type: job\n'+
'      job: "./jobs/load_raw_orders.yaml"\n'+
'    - name: load_raw_customers\n'+
'      type: job\n'+
'      job: "./jobs/load_raw_customers.yaml"\n'+
'    - name: dbt_build\n'+
'      type: action\n'+
'      action: shell\n'+
'      command: "dbt build --select source:raw+"\n'+
'      depends_on: ["load_raw_orders", "load_raw_customers"]\n'+
'    - name: dbt_test\n'+
'      type: action\n'+
'      action: shell\n'+
'      command: "dbt test"\n'+
'      depends_on: ["dbt_build"]\n'},
{n:'Airflow — chaîne linéaire avec branche',f:'workflows/nightly_export.yaml',s:
'version: "1.0"\n'+
'workflow:\n'+
'  name: nightly_export\n'+
'  trigger:\n'+
'    type: schedule\n'+
'    cron: "0 1 * * *"\n'+
'  steps:\n'+
'    - name: dump\n'+
'      type: action\n'+
'      action: shell\n'+
'      command: "pg_dump -t orders > /tmp/dump.csv"\n'+
'    - name: nightly_export\n'+
'      type: job\n'+
'      job: "./jobs/nightly_export.yaml"\n'+
'      depends_on: ["dump"]\n'+
'    - name: is_weekday\n'+
'      type: condition\n'+
'      depends_on: ["nightly_export"]\n'+
'    - name: notify_slack\n'+
'      type: action\n'+
'      action: shell\n'+
'      command: "curl -X POST $SLACK_HOOK"\n'+
'      depends_on: ["is_weekday"]\n'+
'    - name: archive\n'+
'      type: job\n'+
'      job: "./jobs/archive.yaml"\n'+
'      depends_on: ["is_weekday"]\n'},
{n:'Dépendance cassée (règle 3)',f:'workflows/broken.yaml',s:
'version: "1.0"\n'+
'workflow:\n'+
'  name: broken\n'+
'  steps:\n'+
'    - name: extract\n'+
'      type: job\n'+
'      job: "./jobs/extract.yaml"\n'+
'    - name: publish\n'+
'      type: job\n'+
'      job: "./jobs/publish.yaml"\n'+
'      depends_on: ["extract", "transfrom"]\n'}];

/* ---------- câblage ---------- */
function draw(){
  var wf=parseWorkflow($("src").value);
  if(!wf.steps.length){
    $("svg").innerHTML='';$("svg").setAttribute('viewBox','0 0 400 60');
    $("cnt").textContent='';$("stat").textContent='no steps found';
    $("err").className='err on';$("err").textContent='No steps: — a workflow needs a steps: list with at least one "- name:".';
    return;
  }
  var r=render(wf);
  $("svg").setAttribute('viewBox','0 0 '+r.w+' '+r.h);
  $("svg").setAttribute('style','max-width:'+r.w+'px');
  $("svg").innerHTML=r.svg;
  $("cnt").textContent=wf.name+(wf.cron?'  ·  '+wf.cron:'');
  $("stat").textContent=wf.steps.length+' steps · '+r.stages+' stages'+(r.broken?' · '+r.broken+' broken':'')+(r.cycles.length?' · cycle':'');
  var msg=[];
  if(r.broken)msg.push(r.broken+' dependency points at a step that does not exist in this file — shown in red rather than silently ignored.');
  if(r.cycles.length)msg.push('Circular dependency through '+r.cycles.join(', ')+'. The cycle was cut to draw the graph; a run would never start.');
  $("err").className='err'+(msg.length?' on':'');
  $("err").textContent=msg.join('  ');
}
$("ex").innerHTML=EX.map(function(e,i){return '<option value="'+i+'">'+esc(e.n)+'</option>'}).join('');
function load(i){$("src").value=EX[i].s;$("fn").textContent=EX[i].f;draw()}
$("ex").onchange=function(){load(+$("ex").value)};
var deb;$("src").addEventListener('input',function(){clearTimeout(deb);deb=setTimeout(draw,100)});
$("theme").onclick=function(){var d=document.documentElement;d.setAttribute('data-theme',d.getAttribute('data-theme')==='dark'?'light':'dark')};
load(0);
</script>
</body>
</html>
