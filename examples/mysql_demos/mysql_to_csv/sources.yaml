# Sources pour démo : MySQL -> CSV
# IMPORTANT : Utilise ${ENV:...} pour résoudre les secrets depuis .env

sources:
  mysql_employees:
    type: mysql
    connection:
      host: ${ENV:MYSQL_HOST}
      port: ${ENV:MYSQL_PORT}
      user: ${ENV:MYSQL_USER}
      password: ${ENV:MYSQL_PASSWORD}
      database: ${ENV:MYSQL_DATABASE}
    extract:
      table: employees
      batch_size: 100
