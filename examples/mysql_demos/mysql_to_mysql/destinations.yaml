# Destinations pour démo : MySQL -> MySQL (vers MariaDB)
# IMPORTANT : Utilise ${ENV:...} pour résoudre les secrets depuis .env
# Note : On cible le conteneur MariaDB pour démontrer la compatibilité

destinations:
  mariadb_target:
    type: mariadb
    connection:
      host: ${ENV:MARIADB_HOST}
      port: ${ENV:MARIADB_PORT}
      user: ${ENV:MARIADB_USER}
      password: ${ENV:MARIADB_PASSWORD}
      database: ${ENV:MARIADB_DATABASE}
    load:
      table: employees
      mode: replace
