version: "1.0"
destinations:
  postgres_orders:
    type: postgresql
    connection:
      host: "{{ env:DEMO_PG_HOST }}"
      port: "{{ env:DEMO_PG_PORT }}"
      user: "{{ env:DEMO_PG_USER }}"
      password: "{{ env:DEMO_PG_PASSWORD }}"
      database: "{{ env:DEMO_PG_DATABASE }}"
    load:
      table: orders
      mode: upsert              # re-running the job updates rows, never duplicates them
      key: [order_id]           # becomes the primary key when Hydra ETL creates the table
      atomic: true              # all or nothing: a failure leaves PostgreSQL as it was
