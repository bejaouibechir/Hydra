<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Découvrez le DSL avant d’installer Hydra</title>
  <desc id="desc">L’extension VS Code fournit la complétion et la validation des manifestes directement dans l’éditeur, sans moteur Hydra requis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf8fc"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0f5270" flood-opacity=".13"/>
    </filter>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#10b981" flood-opacity=".22"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0e7490" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="32" fill="url(#grid)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="800" y="78" text-anchor="middle" fill="#0f2940" font-size="52" font-weight="800" letter-spacing=".5">DÉCOUVREZ LE DSL AVANT D’INSTALLER HYDRA</text>
    <text x="800" y="120" text-anchor="middle" fill="#557286" font-size="20">Complétion et validation, directement dans l’éditeur.</text>

    <!-- Editor window -->
    <g transform="translate(62 172)" filter="url(#shadow)">
      <rect width="1010" height="590" rx="30" fill="#ffffff" stroke="#22b8cf" stroke-width="4"/>
      <path d="M0 62h1010" stroke="#b7dce6" stroke-width="2"/>
      <circle cx="32" cy="31" r="8" fill="#fb7185"/><circle cx="58" cy="31" r="8" fill="#fbbf24"/><circle cx="84" cy="31" r="8" fill="#34d399"/>
      <text x="505" y="39" text-anchor="middle" fill="#17364d" font-size="17" font-weight="800">VS Code · Extension Hydra ETL</text>

      <!-- Explorer -->
      <g transform="translate(0 62)">
        <rect width="225" height="528" fill="#f1f8fb"/>
        <text x="24" y="38" fill="#506f83" font-size="13" font-weight="900" letter-spacing="2">EXPLORATEUR</text>
        <text x="24" y="78" fill="#17364d" font-size="15" font-weight="800">HYDRA-JOB</text>
        <g font-size="15">
          <text x="38" y="116" fill="#0891b2">◇</text><text x="63" y="116" fill="#557286">sources.yaml</text>
          <rect x="20" y="132" width="185" height="34" rx="7" fill="#dff5fa"/>
          <text x="38" y="155" fill="#0891b2">◇</text><text x="63" y="155" fill="#17364d" font-weight="800">pipeline.yaml</text>
          <text x="38" y="194" fill="#0891b2">◇</text><text x="63" y="194" fill="#557286">destinations.yaml</text>
          <text x="38" y="233" fill="#0891b2">◇</text><text x="63" y="233" fill="#557286">transformations.yaml</text>
        </g>
        <path d="M225 0v528" stroke="#cfe3ea" stroke-width="2"/>
      </g>

      <!-- Editor tab -->
      <g transform="translate(225 62)">
        <rect width="785" height="48" fill="#f8fbfc"/>
        <rect width="190" height="48" fill="#ffffff"/>
        <path d="M0 47h190" stroke="#22b8cf" stroke-width="3"/>
        <text x="24" y="31" fill="#17364d" font-size="15" font-weight="800">pipeline.yaml</text>
        <circle cx="171" cy="24" r="5" fill="#34d399"/>
      </g>

      <!-- Code editor -->
      <g transform="translate(225 110)" font-family="Consolas,monospace">
        <rect width="785" height="345" fill="#ffffff"/>
        <g fill="#9bb0bd" font-size="14" text-anchor="end">
          <text x="35" y="35">1</text><text x="35" y="67">2</text><text x="35" y="99">3</text><text x="35" y="131">4</text><text x="35" y="163">5</text><text x="35" y="195">6</text><text x="35" y="227">7</text>
        </g>
        <g font-size="17">
          <text x="57" y="35" fill="#17364d">pipeline:</text>
          <text x="84" y="67" fill="#3b82f6">source:</text><text x="181" y="67" fill="#557286">orders_api</text>
          <text x="84" y="99" fill="#3b82f6">transformations:</text>
          <text x="111" y="131" fill="#557286">- type:</text><text x="208" y="131" fill="#0891b2">filter</text>
          <text x="111" y="163" fill="#557286">- type:</text><text x="208" y="163" fill="#0891b2">ca</text>
          <rect x="228" y="143" width="2" height="26" fill="#0891b2"/>
        </g>

        <!-- Completion popup -->
        <g transform="translate(198 180)" font-family="Inter,Segoe UI,Arial,sans-serif">
          <rect width="292" height="142" rx="14" fill="#ffffff" stroke="#8bc6d8" stroke-width="2" filter="url(#shadow)"/>
          <rect x="8" y="8" width="276" height="38" rx="9" fill="#e5f7fb"/>
          <circle cx="29" cy="27" r="11" fill="#22b8cf"/>
          <path d="M24 27h10M29 22v10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <text x="50" y="32" fill="#17364d" font-size="15" font-weight="800">cast</text>
          <text x="50" y="72" fill="#557286" font-size="15">calculate</text>
          <text x="50" y="105" fill="#557286" font-size="15">canonicalize</text>
          <text x="14" y="131" fill="#16829c" font-size="12" font-weight="700">Complétion DSL Hydra</text>
        </g>

        <!-- Inline documentation -->
        <g transform="translate(520 43)" font-family="Inter,Segoe UI,Arial,sans-serif">
          <rect width="230" height="112" rx="16" fill="#f7fbfd" stroke="#bdd9e3" stroke-width="2"/>
          <text x="18" y="29" fill="#17364d" font-size="15" font-weight="900">source</text>
          <text x="18" y="54" fill="#557286" font-size="13">Référence obligatoire vers</text>
          <text x="18" y="74" fill="#557286" font-size="13">une source de données déclarée.</text>
          <text x="18" y="98" fill="#16829c" font-size="12" font-weight="700">Schéma Hydra</text>
        </g>
      </g>

      <!-- Problems / validation panel -->
      <g transform="translate(225 455)">
        <rect width="785" height="135" fill="#f8fbfc"/>
        <path d="M0 0h785" stroke="#cfe3ea" stroke-width="2"/>
        <text x="24" y="32" fill="#506f83" font-size="13" font-weight="900" letter-spacing="1.5">PROBLÈMES</text>
        <circle cx="119" cy="27" r="12" fill="#34d399"/>
        <text x="119" y="32" text-anchor="middle" fill="#075e4d" font-size="13" font-weight="900">0</text>
        <g transform="translate(24 50)">
          <rect width="737" height="58" rx="15" fill="#ecfdf5" stroke="#a4e8d2" stroke-width="2"/>
          <circle cx="31" cy="29" r="15" fill="#34d399"/>
          <path d="M24 29l5 5 10-13" fill="none" stroke="#075e4d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="61" y="26" fill="#075e4d" font-size="16" font-weight="900">MANIFESTE VALIDE</text>
          <text x="61" y="45" fill="#397666" font-size="13">schéma, références et valeurs vérifiés dans l’éditeur</text>
        </g>
      </g>
    </g>

    <!-- Adoption value -->
    <g transform="translate(1118 172)">
      <text x="210" y="30" text-anchor="middle" fill="#506f83" font-size="17" font-weight="800" letter-spacing="2">DÉCOUVERTE SANS INSTALLATION</text>
      <g transform="translate(0 66)" filter="url(#shadow)">
        <rect width="420" height="524" rx="32" fill="#ffffff" stroke="#91c8d9" stroke-width="3"/>
        <circle cx="210" cy="79" r="48" fill="#e8fafd" stroke="#22b8cf" stroke-width="3"/>
        <path d="M184 64h52v38h-52zM195 111h30" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="210" y="157" text-anchor="middle" fill="#17364d" font-size="25" font-weight="900">EXTENSION VS CODE</text>
        <text x="210" y="187" text-anchor="middle" fill="#58758a" font-size="16">installez une extension d’éditeur</text>

        <g transform="translate(35 222)">
          <g fill="#f3fafc" stroke="#b7dbe6" stroke-width="2">
            <rect width="350" height="67" rx="17"/>
            <rect y="83" width="350" height="67" rx="17"/>
            <rect y="166" width="350" height="67" rx="17"/>
          </g>
          <g fill="#34d399">
            <circle cx="31" cy="33" r="14"/><circle cx="31" cy="116" r="14"/><circle cx="31" cy="199" r="14"/>
          </g>
          <g fill="none" stroke="#075e4d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M24 33l5 5 10-13"/><path d="M24 116l5 5 10-13"/><path d="M24 199l5 5 10-13"/>
          </g>
          <g fill="#274f65" font-size="17" font-weight="800">
            <text x="61" y="29">Complétion</text><text x="61" y="50" fill="#647f90" font-size="13" font-weight="400">découvrez les clés DSL valides</text>
            <text x="61" y="112">Validation</text><text x="61" y="133" fill="#647f90" font-size="13" font-weight="400">détectez les erreurs pendant la saisie</text>
            <text x="61" y="195">Documentation</text><text x="61" y="216" fill="#647f90" font-size="13" font-weight="400">apprenez dans le manifeste</text>
          </g>
        </g>

        <g transform="translate(58 473)" filter="url(#greenGlow)">
          <rect width="304" height="70" rx="26" fill="url(#green)"/>
          <circle cx="39" cy="35" r="21" fill="#effff9"/>
          <path d="M30 35l6 6 14-17" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="75" y="31" fill="#043b31" font-size="18" font-weight="900">SANS INSTALLER HYDRA</text>
          <text x="75" y="51" fill="#075e4d" font-size="13" font-weight="700">explorez avant d’adopter</text>
        </g>
      </g>
    </g>

    <text x="800" y="827" text-anchor="middle" fill="#17364d" font-size="20" font-weight="900">La première expérience du produit commence avant son installation.</text>
    <text x="800" y="860" text-anchor="middle" fill="#557286" font-size="16">Écrivez. Découvrez. Validez. Puis décidez d’exécuter.</text>
  </g>
</svg>
