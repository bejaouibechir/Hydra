# Two containers: the one you work in, and the database it talks to.
# They share a network, so the pipeline reaches MySQL by its service name.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - .:/workspaces/hydra-demo:cached
    command: sleep infinity
    environment:
      MYSQL_USER: hydra
      MYSQL_PASSWORD: hydra-demo-password
      HYDRA_WORKSPACE: /workspaces
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"        # also forwarded to your browser, so you can connect from outside
    environment:
      MYSQL_ROOT_PASSWORD: root-demo
      MYSQL_DATABASE: orders_dev
      MYSQL_USER: hydra
      MYSQL_PASSWORD: hydra-demo-password
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot-demo"]
      interval: 5s
      timeout: 5s
      retries: 30
