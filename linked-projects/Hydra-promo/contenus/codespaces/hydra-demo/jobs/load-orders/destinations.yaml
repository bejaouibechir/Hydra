version: "1.0"
destinations:
  dst_mysql:
    type: mysql
    connection:
      host: "{{ param:mysql_host }}"
      port: "{{ param:mysql_port }}"
      database: "{{ param:mysql_database }}"
      user: ${SECRET:mysql.user}
      password: ${SECRET:mysql.password}
    load:
      table: orders
      mode: replace
