<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The MCP that checks before it saves</title>
  <desc id="desc">An AI agent composes a pipeline, a machine validates it, and only verified output can be saved. Other MCP servers expose models or connections without validating an AI-composed pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf8fc"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0f5270" flood-opacity=".13"/>
    </filter>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#10b981" flood-opacity=".24"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0e7490" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#22b8cf"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="32" fill="url(#grid)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="800" y="78" text-anchor="middle" fill="#0f2940" font-size="52" font-weight="800" letter-spacing=".5">THE MCP THAT CHECKS BEFORE IT SAVES</text>
    <text x="800" y="120" text-anchor="middle" fill="#557286" font-size="20">The agent can compose. Only machine-verified pipelines are persisted.</text>

    <!-- Main verified flow -->
    <g transform="translate(74 192)">
      <!-- AI agent -->
      <g filter="url(#shadow)">
        <rect width="285" height="250" rx="30" fill="#ffffff" stroke="#91c8d9" stroke-width="3"/>
        <circle cx="142" cy="74" r="45" fill="#e8fafd" stroke="#22b8cf" stroke-width="3"/>
        <rect x="116" y="55" width="52" height="42" rx="12" fill="none" stroke="#0891b2" stroke-width="4"/>
        <circle cx="131" cy="75" r="4" fill="#0891b2"/><circle cx="153" cy="75" r="4" fill="#0891b2"/>
        <path d="M130 87h24M142 45V34M105 75H94M190 75h-11" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
        <text x="142" y="151" text-anchor="middle" fill="#17364d" font-size="26" font-weight="800">AI AGENT</text>
        <text x="142" y="184" text-anchor="middle" fill="#58758a" font-size="17">composes a pipeline</text>
        <rect x="77" y="205" width="130" height="28" rx="14" fill="#eef9fc"/>
        <text x="142" y="224" text-anchor="middle" fill="#16829c" font-size="13" font-weight="700">MCP write request</text>
      </g>

      <path d="M303 125h92" fill="none" stroke="#22b8cf" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

      <!-- Draft pipeline -->
      <g transform="translate(415)" filter="url(#shadow)">
        <rect width="285" height="250" rx="30" fill="#ffffff" stroke="#91c8d9" stroke-width="3"/>
        <circle cx="142" cy="74" r="45" fill="#e8fafd" stroke="#22b8cf" stroke-width="3"/>
        <path d="M112 58h61v45h-61zM112 72h61M126 86h33" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="122" cy="65" r="3" fill="#34d399"/>
        <text x="142" y="151" text-anchor="middle" fill="#17364d" font-size="26" font-weight="800">DRAFT PIPELINE</text>
        <text x="142" y="184" text-anchor="middle" fill="#58758a" font-size="17">not trusted yet</text>
        <rect x="76" y="205" width="132" height="28" rx="14" fill="#fff4f6"/>
        <text x="142" y="224" text-anchor="middle" fill="#a43f52" font-size="13" font-weight="700">cannot be saved</text>
      </g>

      <path d="M718 125h92" fill="none" stroke="#22b8cf" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

      <!-- Machine validation gate -->
      <g transform="translate(830 -27)" filter="url(#shadow)">
        <rect width="340" height="304" rx="34" fill="#eefbfd" stroke="#22b8cf" stroke-width="4"/>
        <text x="170" y="51" text-anchor="middle" fill="#16445b" font-size="24" font-weight="900">MACHINE VALIDATION</text>
        <g transform="translate(31 76)">
          <g fill="#ffffff" stroke="#9ed8e3" stroke-width="2">
            <rect width="278" height="47" rx="13"/>
            <rect y="57" width="278" height="47" rx="13"/>
            <rect y="114" width="278" height="47" rx="13"/>
          </g>
          <g fill="#34d399">
            <circle cx="27" cy="24" r="12"/><circle cx="27" cy="81" r="12"/><circle cx="27" cy="138" r="12"/>
          </g>
          <g fill="none" stroke="#075e4d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 24l4 4 8-10"/><path d="M21 81l4 4 8-10"/><path d="M21 138l4 4 8-10"/>
          </g>
          <g fill="#274f65" font-size="16" font-weight="700">
            <text x="52" y="30">Schema and types</text>
            <text x="52" y="87">References and connectors</text>
            <text x="52" y="144">Execution plan</text>
          </g>
        </g>
        <rect x="72" y="253" width="196" height="35" rx="17" fill="#d9faf0"/>
        <text x="170" y="276" text-anchor="middle" fill="#087a5e" font-size="14" font-weight="800">DETERMINISTIC GATE</text>
      </g>

      <path d="M1188 125h92" fill="none" stroke="#22b8cf" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

      <!-- Saved output -->
      <g transform="translate(1300)" filter="url(#greenGlow)">
        <rect width="180" height="250" rx="30" fill="#ffffff" stroke="#34d399" stroke-width="4"/>
        <circle cx="90" cy="73" r="45" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
        <path d="M68 74l14 14 31-38" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="90" y="151" text-anchor="middle" fill="#075e4d" font-size="25" font-weight="900">SAVED</text>
        <text x="90" y="181" text-anchor="middle" fill="#397666" font-size="15">verified output</text>
        <rect x="29" y="205" width="122" height="28" rx="14" fill="url(#green)"/>
        <text x="90" y="224" text-anchor="middle" fill="#053c31" font-size="13" font-weight="800">SAFE TO PERSIST</text>
      </g>

      <!-- Rejected branch -->
      <path d="M1000 286v82" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round" marker-end="url(#redArrow)"/>
      <g transform="translate(850 382)">
        <rect width="300" height="70" rx="20" fill="#fff5f6" stroke="#fb9aaa" stroke-width="2"/>
        <circle cx="38" cy="35" r="18" fill="#ef476f"/>
        <path d="M31 28l14 14m0-14L31 42" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <text x="68" y="30" fill="#90283b" font-size="17" font-weight="800">INVALID</text>
        <text x="68" y="52" fill="#a85463" font-size="14">rejected · not saved</text>
      </g>
    </g>

    <!-- Comparison -->
    <text x="800" y="697" text-anchor="middle" fill="#506f83" font-size="16" font-weight="800" letter-spacing="2">NOT ALL MCP SERVERS VALIDATE WHAT THE AGENT WRITES</text>
    <g transform="translate(135 728)">
      <g>
        <rect width="390" height="108" rx="20" fill="#ffffff" stroke="#b7ced8" stroke-width="2"/>
        <circle cx="38" cy="36" r="13" fill="#ef476f"/>
        <path d="M32 30l12 12m0-12L32 42" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        <text x="64" y="42" fill="#17364d" font-size="20" font-weight="800">dbt MCP</text>
        <text x="38" y="78" fill="#647f90" font-size="16">exposes models</text>
      </g>
      <g transform="translate(470)">
        <rect width="390" height="108" rx="20" fill="#ffffff" stroke="#b7ced8" stroke-width="2"/>
        <circle cx="38" cy="36" r="13" fill="#ef476f"/>
        <path d="M32 30l12 12m0-12L32 42" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        <text x="64" y="42" fill="#17364d" font-size="20" font-weight="800">Airbyte MCP</text>
        <text x="38" y="78" fill="#647f90" font-size="16">exposes connections</text>
      </g>
      <g transform="translate(940)" filter="url(#greenGlow)">
        <rect width="390" height="108" rx="20" fill="#effcf7" stroke="#34d399" stroke-width="3"/>
        <circle cx="38" cy="36" r="13" fill="#34d399"/>
        <path d="M31 36l5 5 10-12" fill="none" stroke="#075e4d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="64" y="42" fill="#075e4d" font-size="20" font-weight="900">Hydra MCP</text>
        <text x="38" y="78" fill="#397666" font-size="16">validates agent-written pipelines</text>
      </g>
    </g>

    <text x="800" y="872" text-anchor="middle" fill="#557286" font-size="16">The differentiator is not MCP access. It is machine verification before persistence.</text>
  </g>
</svg>
