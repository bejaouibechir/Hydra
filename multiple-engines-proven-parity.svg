<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Multiple engines, one proven result</title>
  <desc id="desc">Each operation can use pandas or DuckDB. Large CSV files can use an optional Rust engine with automatic Python fallback. Parity is proven across 26,000 CSV files and one million floats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf8fc"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0f5270" flood-opacity=".13"/>
    </filter>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#10b981" flood-opacity=".24"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0e7490" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#22b8cf"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="32" fill="url(#grid)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="800" y="78" text-anchor="middle" fill="#0f2940" font-size="52" font-weight="800" letter-spacing=".5">MULTIPLE ENGINES. ONE PROVEN RESULT.</text>
    <text x="800" y="120" text-anchor="middle" fill="#557286" font-size="20">Choose the best execution path without changing the answer.</text>

    <!-- Operation router -->
    <g transform="translate(62 222)" filter="url(#shadow)">
      <rect width="280" height="270" rx="30" fill="#ffffff" stroke="#91c8d9" stroke-width="3"/>
      <circle cx="140" cy="73" r="44" fill="#e8fafd" stroke="#22b8cf" stroke-width="3"/>
      <path d="M111 59h58M111 73h37M111 87h49" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
      <circle cx="168" cy="59" r="6" fill="#34d399"/><circle cx="148" cy="73" r="6" fill="#3b82f6"/><circle cx="160" cy="87" r="6" fill="#f59e0b"/>
      <text x="140" y="145" text-anchor="middle" fill="#17364d" font-size="24" font-weight="900">EACH OPERATION</text>
      <text x="140" y="179" text-anchor="middle" fill="#58758a" font-size="17">is routed independently</text>
      <rect x="54" y="208" width="172" height="34" rx="17" fill="#eef9fc"/>
      <text x="140" y="230" text-anchor="middle" fill="#16829c" font-size="14" font-weight="800">ENGINE SELECTOR</text>
    </g>

    <!-- Router split -->
    <path d="M360 357h78" fill="none" stroke="#22b8cf" stroke-width="6" stroke-linecap="round"/>
    <path d="M438 357v-133h75M438 357h75M438 357v133h75" fill="none" stroke="#22b8cf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- Engine cards -->
    <g filter="url(#shadow)">
      <g transform="translate(532 161)">
        <rect width="355" height="174" rx="26" fill="#ffffff" stroke="#89c9dc" stroke-width="3"/>
        <circle cx="55" cy="55" r="30" fill="#e8fafd" stroke="#22b8cf" stroke-width="2.5"/>
        <text x="55" y="63" text-anchor="middle" fill="#0891b2" font-size="20" font-weight="900">pd</text>
        <text x="103" y="51" fill="#17364d" font-size="25" font-weight="900">pandas</text>
        <text x="103" y="78" fill="#58758a" font-size="16">flexible Python operations</text>
        <path d="M32 113h291" stroke="#d7e8ee" stroke-width="2"/>
        <text x="32" y="143" fill="#39788f" font-size="15" font-weight="700">selected operation by operation</text>
      </g>

      <g transform="translate(532 357)">
        <rect width="355" height="174" rx="26" fill="#ffffff" stroke="#89c9dc" stroke-width="3"/>
        <circle cx="55" cy="55" r="30" fill="#e8fafd" stroke="#22b8cf" stroke-width="2.5"/>
        <text x="55" y="63" text-anchor="middle" fill="#0891b2" font-size="18" font-weight="900">SQL</text>
        <text x="103" y="51" fill="#17364d" font-size="25" font-weight="900">DuckDB</text>
        <text x="103" y="78" fill="#58758a" font-size="16">analytical SQL execution</text>
        <path d="M32 113h291" stroke="#d7e8ee" stroke-width="2"/>
        <text x="32" y="143" fill="#39788f" font-size="15" font-weight="700">warehouse power · no warehouse</text>
      </g>

      <g transform="translate(532 553)">
        <rect width="355" height="174" rx="26" fill="#fffaf2" stroke="#f0b95d" stroke-width="3"/>
        <circle cx="55" cy="55" r="30" fill="#fff3d9" stroke="#f59e0b" stroke-width="2.5"/>
        <text x="55" y="63" text-anchor="middle" fill="#b76d00" font-size="22" font-weight="900">Rs</text>
        <text x="103" y="51" fill="#17364d" font-size="25" font-weight="900">Rust CSV engine</text>
        <text x="103" y="78" fill="#7f6b48" font-size="16">optional native acceleration</text>
        <rect x="31" y="111" width="292" height="42" rx="21" fill="#fff0cc"/>
        <text x="177" y="138" text-anchor="middle" fill="#9a5c00" font-size="16" font-weight="900">4× FASTER · 1M ROWS</text>
      </g>
    </g>

    <!-- Auto fallback -->
    <path d="M702 746v38h-218v-72" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/>
    <g transform="translate(214 672)">
      <rect width="270" height="80" rx="20" fill="#ffffff" stroke="#9fc9d8" stroke-width="2"/>
      <circle cx="38" cy="40" r="18" fill="#e8fafd" stroke="#22b8cf" stroke-width="2"/>
      <path d="M29 40h18m-7-8l8 8-8 8" fill="none" stroke="#0891b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="34" fill="#17364d" font-size="17" font-weight="800">Python fallback</text>
      <text x="68" y="56" fill="#647f90" font-size="13">automatic when guarantees fail</text>
    </g>

    <!-- Convergence to parity -->
    <g fill="none" stroke="#22b8cf" stroke-width="5" stroke-linecap="round">
      <path d="M905 248h76v160"/>
      <path d="M905 444h76v-36"/>
      <path d="M905 640h76V408"/>
      <path d="M981 408h62" marker-end="url(#arrow)"/>
    </g>

    <!-- Parity proof hero -->
    <g transform="translate(1062 171)" filter="url(#greenGlow)">
      <rect width="470" height="548" rx="36" fill="#ffffff" stroke="#34d399" stroke-width="4"/>
      <circle cx="235" cy="78" r="48" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
      <path d="M211 79l16 16 34-42" fill="none" stroke="#059669" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="235" y="157" text-anchor="middle" fill="#075e4d" font-size="31" font-weight="900">PARITY PROOF</text>
      <text x="235" y="190" text-anchor="middle" fill="#397666" font-size="17">not a promise — measured evidence</text>

      <g transform="translate(35 225)">
        <rect width="400" height="92" rx="20" fill="#effcf7" stroke="#a4e8d2" stroke-width="2"/>
        <text x="31" y="42" fill="#075e4d" font-size="31" font-weight="900">26,000</text>
        <text x="156" y="37" fill="#274f65" font-size="18" font-weight="800">CSV files tested</text>
        <text x="156" y="63" fill="#397666" font-size="15">zero differences</text>
      </g>

      <g transform="translate(35 333)">
        <rect width="400" height="92" rx="20" fill="#effcf7" stroke="#a4e8d2" stroke-width="2"/>
        <text x="31" y="42" fill="#075e4d" font-size="31" font-weight="900">1,000,000</text>
        <text x="207" y="37" fill="#274f65" font-size="18" font-weight="800">floats compared</text>
        <text x="207" y="63" fill="#397666" font-size="15">against CPython repr()</text>
      </g>

      <g transform="translate(35 441)">
        <rect width="400" height="74" rx="22" fill="url(#green)"/>
        <circle cx="42" cy="37" r="21" fill="#effff9"/>
        <path d="M32 37l7 7 15-19" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="78" y="32" fill="#043b31" font-size="20" font-weight="900">BYTE-FOR-BYTE IDENTICAL</text>
        <text x="78" y="54" fill="#075e4d" font-size="14" font-weight="700">same input · same result</text>
      </g>
    </g>

    <text x="800" y="843" text-anchor="middle" fill="#17364d" font-size="19" font-weight="800">Anyone can say “we use Rust.” The proof is that nothing changes except speed.</text>
    <text x="800" y="873" text-anchor="middle" fill="#557286" font-size="15">Performance is optional. Correctness is not.</text>
  </g>
</svg>
