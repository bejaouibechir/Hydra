workflow:
  name: "my_etl"
  description: "Fan-out / fan-in: extract → [transform_a, transform_b] → load"
  trigger:
    type: manual
  steps:
    - name: "extract"
      type: job
      job: "./jobs/extract"
      depends_on: []
      on_failure: fail

    - name: "transform_a"
      type: job
      job: "./jobs/transform_a"
      depends_on: ["extract"]
      on_failure: fail

    - name: "transform_b"
      type: job
      job: "./jobs/transform_b"
      depends_on: ["extract"]
      on_failure: fail

    - name: "load"
      type: job
      job: "./jobs/load"
      depends_on: ["transform_a", "transform_b"]
      on_failure: fail
