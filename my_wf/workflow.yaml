workflow:
  name: "my_wf"
  description: "Sequential pipeline: job_a → job_b → notify"
  trigger:
    type: manual
  steps:
    - name: "job_a"
      type: job
      job: "./jobs/job_a"
      depends_on: []
      on_failure: fail

    - name: "job_b"
      type: job
      job: "./jobs/job_b"
      depends_on: ["job_a"]
      on_failure: fail

    - name: "notify"
      type: action
      action: log
      params:
        message: "Workflow my_wf completed successfully."
      depends_on: ["job_b"]
      on_failure: skip
