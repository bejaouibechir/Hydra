[package]
name = "hydra_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Native (Rust) accelerators for Hydra ETL"
license = "AGPL-3.0-or-later"

[lib]
name = "hydra_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
# No abi3: pyo3-arrow needs the full C API. Wheels are built per Python version.
pyo3 = { version = "0.29.2" }
pyo3-arrow = "0.19.0"
arrow-array = "59.3.0"
arrow-schema = "59.3.0"

[features]
# Enabled by maturin when building the Python extension; off for `cargo test`
# so that the test binary links against libpython normally.
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "thin"
codegen-units = 1
