workflow:
  name: "sched_wf"
  description: "Scheduled pipeline — runs daily at 08:00"
  trigger:
    type: schedule
    cron: "0 8 * * *"
  steps:
    - name: "extract"
      type: job
      job: "./jobs/extract"
      depends_on: []
      on_failure: fail

    - name: "transform"
      type: job
      job: "./jobs/transform"
      depends_on: ["extract"]
      on_failure: fail

    - name: "load"
      type: job
      job: "./jobs/load"
      depends_on: ["transform"]
      on_failure: fail

    - name: "notify"
      type: action
      action: log
      params:
        message: "Scheduled workflow sched_wf completed."
      depends_on: ["load"]
      on_failure: skip
