<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Serveur MCP, parlez à Hydra en langage naturel</title>
  <desc id="desc">Un utilisateur décrit un pipeline en langage naturel. Un assistant IA écrit le pipeline via le serveur MCP, puis Hydra le valide avant de produire un manifeste vérifié.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf8fc"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0f5270" flood-opacity=".13"/>
    </filter>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#10b981" flood-opacity=".22"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0e7490" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#22b8cf"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="32" fill="url(#grid)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="800" y="78" text-anchor="middle" fill="#0f2940" font-size="52" font-weight="800" letter-spacing=".5">SERVEUR MCP : PARLEZ À HYDRA EN LANGAGE NATUREL</text>
    <text x="800" y="120" text-anchor="middle" fill="#557286" font-size="20">Votre assistant écrit le pipeline. Hydra le valide.</text>

    <!-- Natural language request -->
    <g transform="translate(64 215)" filter="url(#shadow)">
      <rect width="350" height="318" rx="30" fill="#ffffff" stroke="#91c8d9" stroke-width="3"/>
      <circle cx="175" cy="66" r="40" fill="#e8fafd" stroke="#22b8cf" stroke-width="3"/>
      <circle cx="175" cy="56" r="13" fill="none" stroke="#0891b2" stroke-width="3"/>
      <path d="M151 91c5-17 15-25 24-25s19 8 24 25" fill="none" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>
      <text x="175" y="137" text-anchor="middle" fill="#17364d" font-size="24" font-weight="900">LANGAGE NATUREL</text>
      <g transform="translate(27 164)">
        <rect width="296" height="116" rx="22" fill="#eef9fc"/>
        <path d="M32 116l-8 20 28-20" fill="#eef9fc"/>
        <text x="25" y="34" fill="#274f65" font-size="16">« Charge les commandes d’hier,</text>
        <text x="25" y="61" fill="#274f65" font-size="16">nettoie les valeurs manquantes,</text>
        <text x="25" y="88" fill="#274f65" font-size="16">puis écris-les dans PostgreSQL. »</text>
      </g>
    </g>

    <path d="M432 374h85" fill="none" stroke="#22b8cf" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- Assistant -->
    <g transform="translate(536 215)" filter="url(#shadow)">
      <rect width="310" height="318" rx="30" fill="#ffffff" stroke="#91c8d9" stroke-width="3"/>
      <circle cx="155" cy="66" r="40" fill="#e8fafd" stroke="#22b8cf" stroke-width="3"/>
      <rect x="132" y="48" width="46" height="37" rx="11" fill="none" stroke="#0891b2" stroke-width="3.5"/>
      <circle cx="145" cy="66" r="3.5" fill="#0891b2"/><circle cx="165" cy="66" r="3.5" fill="#0891b2"/>
      <path d="M145 77h20M155 39V30M122 66h-9M197 66h-9" stroke="#0891b2" stroke-width="3.5" stroke-linecap="round"/>
      <text x="155" y="137" text-anchor="middle" fill="#17364d" font-size="24" font-weight="900">ASSISTANT IA</text>
      <text x="155" y="169" text-anchor="middle" fill="#58758a" font-size="16">comprend la demande</text>
      <g transform="translate(32 187)" font-family="Consolas,monospace">
        <rect width="246" height="90" rx="17" fill="#f7fbfd" stroke="#bdd9e3" stroke-width="2"/>
        <text x="18" y="27" fill="#0891b2" font-size="14">source: orders</text>
        <text x="18" y="51" fill="#3b82f6" font-size="14">transform: clean_nulls</text>
        <text x="18" y="75" fill="#b76d00" font-size="14">target: postgres</text>
      </g>
      <rect x="80" y="284" width="150" height="26" rx="13" fill="#fff4f6"/>
      <text x="155" y="302" text-anchor="middle" fill="#a43f52" font-size="13" font-weight="800">BROUILLON · PAS ENCORE FIABLE</text>
    </g>

    <path d="M864 374h85" fill="none" stroke="#22b8cf" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- MCP and Hydra validation -->
    <g transform="translate(968 174)" filter="url(#shadow)">
      <rect width="568" height="400" rx="34" fill="#eefbfd" stroke="#22b8cf" stroke-width="4"/>
      <g transform="translate(31 29)">
        <rect width="506" height="72" rx="20" fill="#ffffff" stroke="#9ed8e3" stroke-width="2"/>
        <circle cx="42" cy="36" r="21" fill="#e8fafd" stroke="#22b8cf" stroke-width="2"/>
        <path d="M31 36h22M42 25v22" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>
        <text x="78" y="31" fill="#17364d" font-size="21" font-weight="900">SERVEUR MCP HYDRA</text>
        <text x="78" y="54" fill="#58758a" font-size="14">requête d’écriture structurée</text>
      </g>
      <path d="M284 112v32" stroke="#22b8cf" stroke-width="5" marker-end="url(#arrow)"/>
      <g transform="translate(31 156)">
        <rect width="506" height="176" rx="24" fill="#ffffff" stroke="#34d399" stroke-width="3"/>
        <text x="253" y="39" text-anchor="middle" fill="#075e4d" font-size="23" font-weight="900">VALIDATION HYDRA</text>
        <g transform="translate(27 59)">
          <g fill="#effcf7" stroke="#b1e8d6" stroke-width="2">
            <rect width="136" height="72" rx="16"/>
            <rect x="158" width="136" height="72" rx="16"/>
            <rect x="316" width="136" height="72" rx="16"/>
          </g>
          <g fill="#34d399">
            <circle cx="25" cy="24" r="11"/><circle cx="183" cy="24" r="11"/><circle cx="341" cy="24" r="11"/>
          </g>
          <g fill="none" stroke="#075e4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 24l4 4 7-9"/><path d="M178 24l4 4 7-9"/><path d="M336 24l4 4 7-9"/>
          </g>
          <g fill="#274f65" font-size="14" font-weight="800">
            <text x="19" y="56">Schéma</text><text x="177" y="56">Références</text><text x="335" y="56">Exécution</text>
          </g>
        </g>
      </g>
      <g transform="translate(118 344)" filter="url(#greenGlow)">
        <rect width="332" height="73" rx="28" fill="url(#green)"/>
        <circle cx="40" cy="36" r="22" fill="#effff9"/>
        <path d="M30 36l7 7 15-19" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="77" y="32" fill="#043b31" font-size="19" font-weight="900">PIPELINE VALIDÉ</text>
        <text x="77" y="53" fill="#075e4d" font-size="13" font-weight="700">sûr à enregistrer et exécuter</text>
      </g>
    </g>

    <!-- Responsibility split -->
    <g transform="translate(238 643)">
      <text x="562" y="0" text-anchor="middle" fill="#506f83" font-size="16" font-weight="800" letter-spacing="2">RESPONSABILITÉS CLAIRES</text>
      <g transform="translate(0 33)" filter="url(#shadow)">
        <rect width="520" height="124" rx="24" fill="#ffffff" stroke="#b7d5e0" stroke-width="2"/>
        <circle cx="52" cy="62" r="27" fill="#e8fafd" stroke="#22b8cf" stroke-width="2"/>
        <path d="M39 52h26M39 62h19M39 72h23" stroke="#0891b2" stroke-width="3.5" stroke-linecap="round"/>
        <text x="95" y="53" fill="#17364d" font-size="21" font-weight="900">L’ASSISTANT ÉCRIT</text>
        <text x="95" y="82" fill="#647f90" font-size="16">l’intention devient un pipeline structuré</text>
      </g>
      <g transform="translate(605 33)" filter="url(#greenGlow)">
        <rect width="520" height="124" rx="24" fill="#effcf7" stroke="#34d399" stroke-width="3"/>
        <circle cx="52" cy="62" r="27" fill="#d9faef" stroke="#34d399" stroke-width="2"/>
        <path d="M39 62l9 9 19-24" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="95" y="53" fill="#075e4d" font-size="21" font-weight="900">HYDRA VALIDE</text>
        <text x="95" y="82" fill="#397666" font-size="16">seuls les pipelines corrects avancent</text>
      </g>
    </g>

    <text x="800" y="854" text-anchor="middle" fill="#17364d" font-size="19" font-weight="800">Parlez naturellement. Obtenez un pipeline que Hydra peut prouver.</text>
    <text x="800" y="880" text-anchor="middle" fill="#557286" font-size="15">Intention humaine en entrée. Configuration validée par machine en sortie.</text>
  </g>
</svg>
