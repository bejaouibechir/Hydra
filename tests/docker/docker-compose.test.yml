version: "3.9"

# Environnement Docker de test Hydra (Étape 8)
# Objectif :
# - Avoir 2 moteurs DB disponibles en parallèle :
#   1) MySQL (pour valider le connecteur sur MySQL)
#   2) MariaDB (pour valider le connecteur sur MariaDB)
# - Précharger une base + tables + données via scripts SQL (initdb)
# - Fournir des healthchecks pour attendre que les DB soient prêtes

services:
  mysql_test:
    image: mysql:8.0
    container_name: hydra_mysql_test
    restart: unless-stopped

    # Variables d'initialisation MySQL
    environment:
      # Mot de passe root (obligatoire)
      MYSQL_ROOT_PASSWORD: root
      # Base créée automatiquement au démarrage
      MYSQL_DATABASE: hydra_test
      # User applicatif (optionnel mais pratique)
      MYSQL_USER: hydra
      MYSQL_PASSWORD: hydra

    # Exposition du port pour inspection (Workbench, etc.)
    # Astuce : évitez 3306 si déjà utilisé sur votre machine
    ports:
      - "3307:3306"

    # Scripts SQL exécutés automatiquement au 1er démarrage
    # Tous les fichiers *.sql dans ce dossier seront exécutés
    volumes:
      - ./sql/mysql:/docker-entrypoint-initdb.d:ro

    # Healthcheck : on attend que MySQL réponde
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

    # Petit durcissement / confort
    command:
      # Force l'encodage et collation en utf8mb4 (utile pour tests réalistes)
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"

  mariadb_test:
    image: mariadb:11.4
    container_name: hydra_mariadb_test
    restart: unless-stopped

    # Variables d'initialisation MariaDB
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: hydra_test
      MARIADB_USER: hydra
      MARIADB_PASSWORD: hydra

    # Exposition du port pour inspection
    ports:
      - "3308:3306"

    # Scripts SQL exécutés automatiquement au 1er démarrage
    volumes:
      - ./sql/mariadb:/docker-entrypoint-initdb.d:ro

    # Healthcheck : ping MariaDB
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"