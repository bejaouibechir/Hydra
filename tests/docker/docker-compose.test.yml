
services:

  # ============================================================
  # MongoDB Service - SANS AUTHENTIFICATION
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: hydra_test_mongodb
    ports:
      - "27017:27017"
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
      - ./mongodb/seed:/seed:ro
    networks:
      - hydra_test_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MySQL Service - SANS USER APPLICATIF
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: hydra_test_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: hydra_test_db
    volumes:
      - ./sql/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - hydra_test_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MariaDB Service - SANS USER APPLICATIF
  # ============================================================
  mariadb:
    image: mariadb:11.2
    container_name: hydra_test_mariadb
    ports:
      - "3307:3306"
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: hydra_test_db
    volumes:
      - ./sql/mariadb:/docker-entrypoint-initdb.d:ro
    networks:
      - hydra_test_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # PostgreSQL Service - MODE TRUST
  # ============================================================
  postgresql:
    image: postgres:16
    container_name: hydra_test_postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hydra_test_db
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./sql/postgresql:/docker-entrypoint-initdb.d:ro
    networks:
      - hydra_test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  hydra_test_network:
    driver: bridge
