# Expected errors: unknown mode, bad delay, empty stage, unknown key "enabled",
# loop without "times", loop with times 0
thread:
  - mode: random
    delay_after: 2x
    workflows:
      - name: workflow1
        enabled: true
  - workflows: []
loops:
  - from: workflow1
    to: workflow1
  - from: workflow1
    to: workflow1
    times: 0
