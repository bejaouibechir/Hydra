# Expected errors: unknown mode, bad delay, empty stage, unknown key "enabled",
# loop without "times", loop with times 0,
# fallback without 'use', fallback without a trigger, unknown fallback key,
# delay_before that is not a duration
thread:
  - mode: random
    delay_after: 2x
    workflows:
      - name: workflow1
        enabled: true
        fallback:
          when: "not source_available('crm_db')"
      - name: workflow3
        delay_before: soon
        fallback:
          use: [workflow3_backup]
          retry: 2
  - workflows: []
loops:
  - from: workflow1
    to: workflow1
  - from: workflow1
    to: workflow1
    times: 0
