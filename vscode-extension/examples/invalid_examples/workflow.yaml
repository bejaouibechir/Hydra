# This file contains DELIBERATE errors.
# Every block below should raise an error in the Problems panel.

workflow:
  name: "test_workflow"
  trigger:
    type: schedule
    # ERROR 1 — type 'schedule' requires 'cron'.

  steps:
    - name: "job_step_without_path"
      type: job
      depends_on: []
      # ERROR 2 — type 'job' requires the 'job' field.

    - name: "action_step_without_action"
      type: action
      depends_on: []
      # ERROR 3 — type 'action' requires the 'action' field.

    - name: "unknown_action"
      type: action
      action: telegram
      depends_on: []
      # ERROR 4 — 'telegram' is not a supported action.

    - name: "invalid_on_failure"
      type: job
      job: "./jobs/example"
      on_failure: retry
      # ERROR 5 — 'retry' is not a valid on_failure value.
      # Valid values are fail, skip, continue.
      # To retry a step, use the separate 'retry:' block.

    - name: "undo_on_a_job"
      type: job
      job: "./jobs/example"
      undo: none
      # ERROR 6 — 'undo' applies to actions; a job is undone automatically.

    - name: "project_without_project"
      type: project
      # ERROR 7 — type 'project' requires the 'project' field.

    - name: "project_with_secret"
      type: project
      project: "../crm_sync"
      variables:
        DB_PASSWORD: "${SECRET:crm_db}"
      # ERROR 8 — secrets are not lent: each project keeps its own.

    - name: "project_bad_isolation"
      type: project
      project: "../crm_sync"
      isolation: thread
      timeout: soon
      # ERROR 9 — isolation is inprocess or subprocess; ERROR 10 — invalid timeout.

    - name: "env_on_a_job"
      type: job
      job: "./jobs/example"
      env: prod
      # ERROR 11 — 'env' applies to type=project.
