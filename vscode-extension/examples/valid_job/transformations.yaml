version: "1.0"
engine: auto            # auto | pandas | duckdb (large volumes)
steps:
  - select:
      columns: [id, customer_id, amount, status, created_at]

  - filter:
      expr: "status == 'paid'"

  - cast:
      mapping:
        id: int
        amount: float

  - calculate:
      column: amount_with_tax
      expr: "amount * 1.2"

  - clean:
      columns: [status]
      case: lower

  - deduplicate:
      columns: [id]
      keep: last

  - window:
      partition_by: [customer_id]
      order_by: [{col: created_at, desc: false}]
      columns:
        order_rank: {func: row_number}
        prev_amount: {func: lag, col: amount, default: 0}
        customer_total: {func: sum, col: amount}

  - sort:
      by: [created_at]
      ascending: false
