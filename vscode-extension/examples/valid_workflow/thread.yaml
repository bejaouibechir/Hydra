version: "1.0"
thread:
  - mode: sequential
    delay_after: 30s
    workflows:
      - name: workflow1
        active: true
        fallback:
          use: [workflow1_backup]
          when: "not source_available('crm_db') or file_age('data/orders.csv') > 24h"
          on_failure: true
      - name: workflow2
        active: false
  - mode: parallel
    workflows:
      - name: export-a
      - name: export-b
        fallback:
          use: export-b-quarantine
          on_failure: true
loops:
  - from: export-b
    to: workflow1
    times: 3
    delay: 5m
