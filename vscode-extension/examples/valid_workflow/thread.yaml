version: "1.0"
thread:
  - mode: sequential
    delay_after: 30s
    workflows:
      - name: workflow1
        active: true
      - name: workflow2
        active: false
  - mode: parallel
    workflows:
      - name: export-a
      - name: export-b
loops:
  - from: export-b
    to: workflow1
    times: 3
    delay: 5m
