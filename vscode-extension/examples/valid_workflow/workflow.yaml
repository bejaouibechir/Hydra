workflow:
  name: "daily_sales_etl"
  description: "Daily extract, two transforms in parallel, then load"
  trigger:
    type: schedule
    cron: "0 8 * * *"
  rollback: true        # on failure, undo the steps already done (last first)
  steps:
    - name: "extract"
      type: job
      job: "./jobs/extract"
      depends_on: []
      on_failure: fail
      retry:
        max: 3
        delay: 5
        backoff: exponential

    - name: "transform_a"
      type: job
      job: "./jobs/transform_a"
      depends_on: ["extract"]
      on_failure: fail

    - name: "transform_b"
      type: job
      job: "./jobs/transform_b"
      depends_on: ["extract"]
      on_failure: fail

    - name: "load"
      type: job
      job: "./jobs/load"
      depends_on: ["transform_a", "transform_b"]
      on_failure: fail

    - name: "notify"
      type: action
      action: log
      params:
        message: "Workflow daily_sales_etl finished."
      depends_on: ["load"]
      on_failure: skip

    - name: "export_copy"
      type: action
      action: bash
      params:
        command: "cp outputs/sales.csv /mnt/share/sales.csv"
      undo:                 # reverses the copy if a later step fails
        action: bash
        params:
          command: "rm -f /mnt/share/sales.csv"
      depends_on: ["notify"]

    - name: "crm_sync"          # sub-project: runs another Hydra project
      type: project
      project: "../crm_sync"    # folder relative to this project (ref: path, the default)
      env: inherit
      params:
        batch_date: "{{ param:run_date }}"
      variables:
        EXPORT_DIR: "out/crm"
      workflows: ["ingest", "report"]
      outputs: ["last_batch"]
      isolation: inprocess
      timeout: "10m"
      overlap: wait
      depends_on: ["export_copy"]

    - name: "after_crm"
      type: action
      action: log
      params:
        message: "crm_sync {{ project:crm_sync.status }} — {{ project:crm_sync.rows }} rows"
      depends_on: ["crm_sync"]
